<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc Scanner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">
      <div class="brand">CryptoCroc Scanner</div>
      <div class="sub" id="statusLine">Laden…</div>
    </div>

    <div class="right">
      <button id="modeBull" class="btn">BULL</button>
      <button id="modeBear" class="btn">BEAR</button>
      <a id="resetLink" class="btn ghost" href="#" target="_blank" rel="noreferrer">RESET</a>
    </div>
  </header>

  <main class="grid">
    <section class="panel">
      <div class="panelTitle">ENTRY</div>
      <div class="stageBody" id="stageEntry"></div>
    </section>

    <section class="panel">
      <div class="panelTitle">HOLD</div>
      <div class="stageBody" id="stageHold"></div>
    </section>

    <section class="panel">
      <div class="panelTitle">SELL</div>
      <div class="stageBody" id="stageSell"></div>
    </section>

    <section class="panel full">
      <div class="panelTitle">RADAR</div>
      <div class="panelHint">RADAR bevat ook BUILDUP/ALMOST/COOLDOWN labels (4 tabellen totaal zoals jij wil).</div>
      <div class="stageBody" id="stageRadar"></div>
    </section>
  </main>

  <!-- Popup -->
  <div class="modal" id="modal">
    <div class="modalBox">
      <div class="modalTop">
        <div>
          <div class="modalTitle" id="mTitle">—</div>
          <div class="modalSub" id="mSub">—</div>
        </div>
        <button class="btn" id="mClose">Sluiten</button>
      </div>

      <div class="modalGrid">
        <div class="modalPanel">
          <div class="panelTitle">Coin info</div>
          <pre class="pre" id="mInfo">—</pre>
        </div>
        <div class="modalPanel">
          <div class="panelTitle">Orderbook (Bitget)</div>
          <pre class="pre" id="mOb">Klik coin…</pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

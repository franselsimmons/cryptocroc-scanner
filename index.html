<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc Scanner</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🐊</span>
      <span class="title">CryptoCroc Scanner</span>
      <span class="subtitle">Funnel + KV memory + OB z-score + risk + hedge</span>
    </div>

    <div class="actions">
      <button id="btnBull" class="pill active">BULL</button>
      <button id="btnBear" class="pill">BEAR</button>
      <button id="btnScan" class="pill primary">Scan nu</button>
      <span id="status" class="chip">idle</span>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" class="banner hidden"></div>

    <section class="grid">
      <div class="panel">
        <div class="panelHead">
          <div class="panelTitle">Funnel</div>
          <div class="panelMeta" id="meta"></div>
        </div>
        <div id="funnel" class="funnel"></div>
      </div>

      <div class="panel">
        <div class="panelHead">
          <div class="panelTitle">Orderbook</div>
          <div class="panelMeta">Wordt alleen gebruikt bij ALMOST/ENTRY</div>
        </div>
        <div id="orderbook" class="ob">
          <div class="muted">Klik op een coin voor details + orderbook.</div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc Scanner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">
      <div class="brand">CryptoCroc Scanner</div>
      <div class="sub" id="statusLine">Status: laden…</div>
    </div>

    <div class="right">
      <button id="modeBull" class="btn">BULL</button>
      <button id="modeBear" class="btn">BEAR</button>
      <button id="scanNow" class="btn primary">Scan nu</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel">
      <div class="panelTitle">Funnel</div>
      <div class="funnelMeta" id="funnelMeta">—</div>

      <div class="stage">
        <div class="stageTitle">ENTRY</div>
        <div class="stageBody" id="stageEntry"></div>
      </div>

      <div class="stage">
        <div class="stageTitle">BUILDUP</div>
        <div class="stageBody" id="stageBuildup"></div>
      </div>

      <div class="stage">
        <div class="stageTitle">RADAR</div>
        <div class="stageBody" id="stageRadar"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panelTitle">Orderbook</div>
      <div class="panelHint">Klik op een coin (ENTRY/BUILDUP/RADAR) om Bitget orderbook + z-score te zien</div>

      <div class="obBox">
        <div class="obTitle" id="obTitle">Geen coin geselecteerd</div>
        <pre class="obPre" id="obData">—</pre>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

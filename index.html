<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc Scanner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">
      <div class="brand">CryptoCroc Scanner</div>
      <div class="sub" id="statusLine">Status: laden…</div>
    </div>

    <div class="right">
      <button id="modeBull" class="btn">BULL</button>
      <button id="modeBear" class="btn">BEAR</button>
      <!-- scan knop weg, alles is automatisch -->
    </div>
  </header>

  <main class="grid">
    <section class="panel">
      <div class="panelTitle">Funnel</div>
      <div class="funnelMeta" id="funnelMeta">—</div>

      <div class="stage">
        <div class="stageTitle">ENTRY / HOLD / SELL</div>
        <div class="stageBody" id="stageEntry"></div>
      </div>

      <div class="stage">
        <div class="stageTitle">ALMOST</div>
        <div class="stageBody" id="stageAlmost"></div>
      </div>

      <div class="stage">
        <div class="stageTitle">BUILDUP</div>
        <div class="stageBody" id="stageBuildup"></div>
      </div>

      <div class="stage">
        <div class="stageTitle">RADAR</div>
        <div class="stageBody" id="stageRadar"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panelTitle">Uitleg</div>
      <div class="panelHint">
        Alles draait automatisch elke 10 minuten. Iedereen ziet dezelfde coins.
        Klik op een coin om popup te openen met coin info + orderbook + SL/TP.
      </div>
    </section>
  </main>

  <!-- POPUP / MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modalCard">
      <div class="modalTop">
        <div>
          <div class="modalTitle" id="mTitle">—</div>
          <div class="modalSub" id="mSub">—</div>
        </div>
        <button id="mClose" class="btn">Sluiten</button>
      </div>

      <div class="modalGrid">
        <div class="modalBox">
          <div class="modalBoxTitle">Coin info</div>
          <pre class="modalPre" id="mCoin">—</pre>
        </div>

        <div class="modalBox">
          <div class="modalBoxTitle">Orderbook + SL/TP</div>
          <pre class="modalPre" id="mOB">—</pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

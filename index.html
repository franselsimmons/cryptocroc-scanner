<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc Scanner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="page topbarInner">
      <div>
        <div class="brand">CryptoCroc Scanner</div>
        <div class="sub" id="statusLine">Status: laden…</div>
      </div>

      <div class="right">
        <div class="btnGroup">
          <button id="modeBull" class="btn">BULL</button>
          <button id="modeBear" class="btn">BEAR</button>
        </div>
        <a id="resetLink" class="btn reset" href="#" target="_blank" rel="noopener">Reset</a>
      </div>
    </div>
  </header>

  <main class="page main">
    <section class="panel">
      <div class="panelHeader">
        <div class="panelTitle">Funnel</div>
        <div class="panelHint" id="funnelMeta">—</div>
      </div>

      <details class="stage" open>
        <summary>
          <div class="stageTitle">ENTRY <span class="badge" id="cntEntry">0</span></div>
          <span class="badge">tap om te openen</span>
        </summary>
        <div class="stageBody" id="stageEntry"></div>
      </details>

      <details class="stage" open>
        <summary>
          <div class="stageTitle">ALMOST <span class="badge" id="cntAlmost">0</span></div>
          <span class="badge">tap om te openen</span>
        </summary>
        <div class="stageBody" id="stageAlmost"></div>
      </details>

      <details class="stage" open>
        <summary>
          <div class="stageTitle">BUILDUP <span class="badge" id="cntBuildup">0</span></div>
          <span class="badge">tap om te openen</span>
        </summary>
        <div class="stageBody" id="stageBuildup"></div>
      </details>

      <details class="stage" open>
        <summary>
          <div class="stageTitle">RADAR <span class="badge" id="cntRadar">0</span></div>
          <span class="badge">tap om te openen</span>
        </summary>
        <div class="stageBody" id="stageRadar"></div>
      </details>
    </section>
  </main>

  <!-- MODAL -->
  <div class="modal hidden" id="modal">
    <div class="modalCard">
      <div class="modalTop">
        <div>
          <div class="modalTitle" id="mTitle">—</div>
          <div class="modalSub" id="mSub">—</div>
        </div>
        <button class="btn" id="mClose">Sluiten</button>
      </div>

      <div class="modalGrid">
        <div class="modalBox">
          <div class="modalBoxTitle">Waarom staat hij hier?</div>
          <pre class="modalPre" id="mWhy">—</pre>
        </div>

        <div class="modalBox">
          <div class="modalBoxTitle">Wat mist voor volgende stap?</div>
          <pre class="modalPre" id="mNeed">—</pre>
        </div>

        <div class="modalBox">
          <div class="modalBoxTitle">Stats</div>
          <pre class="modalPre" id="mStats">—</pre>
        </div>

        <div class="modalBox">
          <div class="modalBoxTitle">Orderbook</div>
          <pre class="modalPre" id="mOB">Klik “Orderbook laden”.</pre>
          <button class="btn" id="mObBtn">Orderbook laden</button>
        </div>

        <div class="modalBox">
          <div class="modalBoxTitle">BTC gate</div>
          <pre class="modalPre" id="mBTC">—</pre>
        </div>

        <div class="modalBox">
          <div class="modalBoxTitle">Plan</div>
          <pre class="modalPre" id="mRisk">—</pre>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

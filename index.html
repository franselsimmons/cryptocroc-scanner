<!doctype html>
<html lang="nl" data-funnel="main">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CryptoCroc Scanner — Main</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="left">
      <div class="brandRow">
        <div class="brand">CryptoCroc Scanner</div>
        <span class="funnelPill">MAIN</span>
      </div>
      <div class="sub" id="statusLine">Status: laden…</div>
    </div>

    <div class="right">
      <div class="toggle">
        <button id="modeBull" class="btn btnToggle">BULL</button>
        <button id="modeBear" class="btn btnToggle">BEAR</button>
      </div>

      <a class="btn btnGhost" href="/moon.html">Moon</a>
    </div>
  </header>

  <main class="grid grid4">
    <section class="panel">
      <div class="panelHead">
        <div class="panelTitle">STAGE 4</div>
        <div class="panelSub">ENTRY</div>
      </div>
      <div class="stageBody" id="stageEntry"></div>
    </section>

    <section class="panel">
      <div class="panelHead">
        <div class="panelTitle">STAGE 3</div>
        <div class="panelSub">ALMOST</div>
      </div>
      <div class="stageBody" id="stageAlmost"></div>
    </section>

    <section class="panel">
      <div class="panelHead">
        <div class="panelTitle">STAGE 2</div>
        <div class="panelSub">BUILDUP</div>
      </div>
      <div class="stageBody" id="stageBuildup"></div>
    </section>

    <section class="panel">
      <div class="panelHead">
        <div class="panelTitle">STAGE 1</div>
        <div class="panelSub">RADAR</div>
      </div>
      <div class="stageBody" id="stageRadar"></div>
    </section>
  </main>

  <!-- MODAL (zelfde voor main + moon) -->
  <div class="modal hidden" id="modal">
    <div class="modalCard">
      <div class="modalTop">
        <div>
          <div class="modalTitle" id="mTitle">—</div>
          <div class="modalSub" id="mSub">—</div>
        </div>
        <button class="btn" id="mClose">Sluiten</button>
      </div>

      <!-- 2 tabs -->
      <div class="tabs">
        <button class="tabBtn active" data-tab="why">Waarom</button>
        <button class="tabBtn" data-tab="risk">Risk</button>
      </div>

      <div class="tabPane" data-pane="why">
        <div class="modalGrid">
          <div class="modalBox">
            <div class="modalBoxTitle">Waarom staat hij hier</div>
            <pre class="modalPre" id="mWhy">—</pre>
          </div>

          <div class="modalBox">
            <div class="modalBoxTitle">Liquidity (OB + Depth)</div>
            <pre class="modalPre" id="mOB">—</pre>
          </div>
        </div>
      </div>

      <div class="tabPane hidden" data-pane="risk">
        <div class="modalGrid">
          <div class="modalBox">
            <div class="modalBoxTitle">Risk (SL / TP)</div>
            <pre class="modalPre" id="mRisk">—</pre>
          </div>

          <div class="modalBox">
            <div class="modalBoxTitle">Next (wat mist nog)</div>
            <pre class="modalPre" id="mNext">—</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moonshots</title>
  <link rel="stylesheet" href="/moon.css" />
</head>
<body>
  <main class="moon-wrap">
    <section class="hero">
      <h1>🌙 Moonshots</h1>
      <div id="moon-status" class="status" data-kind="idle">Status: laden...</div>
      <p class="hero-sub">Vroege explosies / proactief (meer setups, meer ruis).</p>

      <div class="actions">
        <button id="btn-bull" class="pill active">BULL</button>
        <button id="btn-bear" class="pill">BEAR</button>
        <button id="btn-refresh" class="pill">Refresh</button>
        <button id="btn-scan" class="pill danger">Scan nu</button>
        <a href="/" class="pill">⬅ Main</a>
      </div>
    </section>

    <section class="panel">
      <h2>ELITE</h2>
      <p>Meest betrouwbaar (OB + depth + confidence + consistency + rolling).</p>
      <div id="moon-elite-list"></div>
    </section>

    <section class="panel">
      <h2>ALMOST</h2>
      <p>Sterk, bijna klaar.</p>
      <div id="moon-almost-list"></div>
    </section>

    <section class="panel">
      <h2>BUILDUP</h2>
      <p>In opbouw / in beeld.</p>
      <div id="moon-buildup-list"></div>
    </section>

    <section class="panel">
      <h2>RADAR</h2>
      <p>Brede watchlist.</p>
      <div id="moon-radar-list"></div>
    </section>

    <section class="panel">
      <h2>BTC / Portfolio</h2>
      <div id="moon-portfolio"></div>
    </section>
  </main>

  <script src="/moon.js"></script>
</body>
</html>

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CryptoCroc Moonshots</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/moon.css" />
</head>
<body>
  <div class="topbar">
    <div class="left">
      <div class="brand">🌙 Moonshots</div>
      <div class="sub">BULL / BEAR aparte funnel (main blijft met rust)</div>
    </div>
    <div class="right">
      <button id="bullBtn">BULL</button>
      <button id="bearBtn">BEAR</button>
      <button id="refreshBtn">Refresh</button>
      <a href="/" class="btn">⬅ Main Funnel</a>
      <span id="status"></span>
    </div>
  </div>

  <div class="container">
    <div class="grid">
      <div class="card">
        <h2>ELITE (meest betrouwbaar)</h2>
        <div id="elite"></div>
      </div>

      <div class="card">
        <h2>ALMOST</h2>
        <div id="almost"></div>
      </div>

      <div class="card">
        <h2>BUILDUP (in beeld)</h2>
        <div id="buildup"></div>
      </div>
    </div>
  </div>

  <script src="/moon.js"></script>
</body>
</html>

name: Historical Smart Selection LONG

on:
  workflow_dispatch:
    inputs:
      days:
        description: Initial/backfill lookback in days
        required: true
        default: '730'
      chunk_days:
        description: Days per parallel shard (safety-clamped to max 5)
        required: true
        default: '5'
      max_contracts:
        description: 0 = all eligible USDT perpetual contracts
        required: true
        default: '0'
      publish:
        description: Commit validated generated evidence file to this repository (no Redis secret required)
        required: true
        type: boolean
        default: true
      refresh_preview:
        description: Kept for UI compatibility; preview is rebuilt by the existing Vercel weekly-freeze after file deployment
        required: true
        type: boolean
        default: true
  schedule:
    # Weekly incremental refresh well before Sunday 22:00 UTC freeze.
    - cron: '15 3 * * 0'

concurrency:
  group: historical-smart-selection-long
  cancel-in-progress: false

permissions:
  contents: write

env:
  BITGET_BASE_URL: https://api.bitget.com
  HISTORICAL_API_CONCURRENCY: '8'
  HISTORICAL_MAX_DAYS: '365'
  HISTORICAL_MAX_OUTCOMES_PER_FAMILY: '600'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish: ${{ steps.params.outputs.publish }}
      max_contracts: ${{ steps.params.outputs.max_contracts }}
      refresh_preview: ${{ steps.params.outputs.refresh_preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "days=35" >> "$GITHUB_OUTPUT"
            echo "chunk_days=5" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "max_contracts=0" >> "$GITHUB_OUTPUT"
            echo "refresh_preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "days=${{ inputs.days }}" >> "$GITHUB_OUTPUT"
            echo "chunk_days=${{ inputs.chunk_days }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "max_contracts=${{ inputs.max_contracts }}" >> "$GITHUB_OUTPUT"
            echo "refresh_preview=${{ inputs.refresh_preview }}" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        shell: bash
        run: |
          MATRIX=$(node src/historical/researchEngine.js plan --days=${{ steps.params.outputs.days }} --chunk-days=${{ steps.params.outputs.chunk_days }})
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          node -e 'const m=JSON.parse(process.argv[1]); console.log(`Historical replay plan: ${m.length} shards; effective shard days <= 5`);' "$MATRIX"

  replay:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - uses: actions/cache@v4
        with:
          path: .historical-cache
          key: long-hist-${{ hashFiles('src/market/scanner.js', 'src/trade/riskEngine.js', 'src/analyze/microFamilies.js', 'src/historical/researchEngine.js') }}-${{ matrix.shard.id }}
          restore-keys: |
            long-hist-${{ hashFiles('src/market/scanner.js', 'src/trade/riskEngine.js', 'src/analyze/microFamilies.js', 'src/historical/researchEngine.js') }}-
      - name: Replay point-in-time shard
        run: >-
          node src/historical/researchEngine.js replay
          --start=${{ matrix.shard.startTs }}
          --end=${{ matrix.shard.endTs }}
          --shard=${{ matrix.shard.id }}
          --max-contracts=${{ needs.plan.outputs.max_contracts }}
          --out=historical-shard
      - uses: actions/upload-artifact@v4
        with:
          name: historical-shard-${{ matrix.shard.id }}
          path: historical-shard/
          if-no-files-found: error
          retention-days: 7

  evidence:
    needs: [plan, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: historical-shard-*
          path: historical-shards
          merge-multiple: true
      - name: Validate downloaded replay artifacts
        shell: bash
        run: |
          MANIFEST_COUNT=$(find historical-shards -type f -name '*.manifest.json' | wc -l | tr -d ' ')
          OUTCOME_COUNT=$(find historical-shards -type f -name '*.outcomes.jsonl' | wc -l | tr -d ' ')
          NONEMPTY_OUTCOME_FILES=$(find historical-shards -type f -name '*.outcomes.jsonl' -size +0c | wc -l | tr -d ' ')
          echo "Replay artifacts: manifests=$MANIFEST_COUNT outcomeFiles=$OUTCOME_COUNT nonEmptyOutcomeFiles=$NONEMPTY_OUTCOME_FILES"
          test "$MANIFEST_COUNT" -gt 0 || { echo "::error::No replay manifest artifacts were downloaded."; exit 1; }
          test "$OUTCOME_COUNT" -gt 0 || { echo "::error::No replay outcome artifacts were downloaded."; exit 1; }
          test "$NONEMPTY_OUTCOME_FILES" -gt 0 || { echo "::error::Replay artifacts exist but every outcome file is empty."; exit 1; }

      - name: Walk-forward + validation + OOS + FDR + shrinkage + correlation
        run: node src/historical/researchEngine.js evidence --input=historical-shards --out=historical-evidence --include-published=false

      - name: Validate evidence is non-empty
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = 'historical-evidence/historical-evidence.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const n = Number(data.totalOutcomes || 0);
          console.log(`Historical evidence totalOutcomes=${n} selectionEligibleFamilies=${Number(data.selectionEligibleFamilies || 0)}`);
          if (!(n > 0)) {
            console.error('::error::Historical evidence contains zero outcomes; refusing to publish an empty generatedEvidence.js.');
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: historical-evidence-long
          path: historical-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Export validated evidence to generated repository file
        if: ${{ needs.plan.outputs.publish == 'true' }}
        run: >-
          node src/historical/researchEngine.js export-file
          --evidence=historical-evidence/historical-evidence.json
          --outcomes=historical-evidence/historical-outcomes-by-family.json
          --target=src/historical/generatedEvidence.js

      - name: Validate generated evidence module
        if: ${{ needs.plan.outputs.publish == 'true' }}
        run: node --check src/historical/generatedEvidence.js

      - name: Commit generated evidence file
        if: ${{ needs.plan.outputs.publish == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/historical/generatedEvidence.js src/historical/generatedEvidence.js.manifest.json
          if git diff --cached --quiet; then
            echo "No generated evidence change to commit."
            exit 0
          fi
          git commit -m "chore: refresh long historical evidence"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: File-backed preview note
        if: ${{ needs.plan.outputs.publish == 'true' && needs.plan.outputs.refresh_preview == 'true' }}
        run: |
          echo "Validated historical evidence is now committed as src/historical/generatedEvidence.js."
          echo "Vercel will deploy the file. The existing weekly-freeze route reads it through historicalEvidenceBridge; no GitHub Redis secret is required."

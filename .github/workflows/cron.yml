name: CryptoCroc Auto Scan

on:
  schedule:
    - cron: "*/10 * * * *"  # elke 10 minuten
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel scan endpoint
        run: |
          curl -sS --fail \
            "https://${{ secrets.VERCEL_URL }}/api/scan?secret=${{ secrets.CRON_SECRET }}" \
            -H "User-Agent: GitHub-Actions" \
            -H "Accept: application/json"

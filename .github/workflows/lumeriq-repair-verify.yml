name: Lumeriq isolated repair verification
on:
  push:
    branches:
      - repair/lumeriq-integrity-20260919
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package exact source safely
        run: |
          git archive --format=tar HEAD > source.tar
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-repair-source
          path: |
            source.tar
            source-commit.txt
          retention-days: 3

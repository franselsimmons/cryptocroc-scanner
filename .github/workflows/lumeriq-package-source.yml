name: Lumeriq package source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/lumeriq-package
          tar --exclude=.git -cf /tmp/lumeriq-package/source.tar .
          git rev-parse HEAD > /tmp/lumeriq-package/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lumeriq-source
          path: /tmp/lumeriq-package
          retention-days: 3

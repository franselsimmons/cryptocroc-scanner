name: Lumeriq package source
on:
  push:
    branches:
      - repair/lumeriq-integrity-20260919
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          git archive --format=tar HEAD > source.tar
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lumeriq-source
          path: |
            source.tar
            source-commit.txt
          retention-days: 3

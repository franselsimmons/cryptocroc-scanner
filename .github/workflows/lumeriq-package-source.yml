name: Lumeriq package source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p package
          cp src/analyze/microFamilies.js package/microFamilies.js
          cp src/historical/researchEngine.js package/researchEngine.js
          cp src/trade/riskEngine.js package/riskEngine.js
          cp src/analyze/historicalEvidenceBridge.js package/historicalEvidenceBridge.js
          cp package.json package/package.json
          git rev-parse HEAD > package/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lumeriq-source
          path: package
          retention-days: 3

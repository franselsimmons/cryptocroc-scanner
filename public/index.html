<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CryptoCroc Scanner</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">🐊</div>
      <div>
        <div class="title">CryptoCroc Scanner</div>
        <div class="sub">Trechter • Memory • Dynamische bands • PRO OB vanaf ALMOST</div>
      </div>
    </div>

    <div class="tabs">
      <button id="tabBull" class="tab">BULL</button>
      <button id="tabBear" class="tab">BEAR</button>
      <button id="btnScan" class="ghost">Scan nu</button>
      <button id="btnRefresh" class="ghost">↻</button>
    </div>

    <div class="status">
      <div id="ts" class="pill">⏳ last scan…</div>
      <div id="meta" class="pill">📌 bands…</div>
    </div>
  </header>

  <main class="wrap">
    <div id="loading" class="loading hidden">🔄 Data laden…</div>
    <section id="tables"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modalCard">
      <div class="modalHead">
        <div id="mTitle" class="mTitle"></div>
        <button id="mClose" class="x">✕</button>
      </div>
      <div id="mBody" class="mBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

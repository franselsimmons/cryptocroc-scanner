<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Runner Family Performance Matrix</title>

  <style>
    :root {
      --bg: #061118;
      --panel: #0a1320;
      --panel2: #07101a;
      --line: rgba(106, 160, 255, 0.22);
      --line2: rgba(255, 255, 255, 0.08);
      --text: #eaf2ff;
      --muted: #93a1b5;
      --soft: #b8c4d7;
      --good: #74f0ae;
      --bad: #ff718d;
      --warn: #ffd866;
      --blue: #76b7ff;
      --purple: #9b6cff;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(113, 87, 255, 0.18), transparent 32rem),
        radial-gradient(circle at 80% 20%, rgba(22, 202, 160, 0.14), transparent 30rem),
        linear-gradient(180deg, #061118 0%, #081a22 45%, #061118 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .shell {
      width: min(1220px, 100%);
      margin: 0 auto;
      padding: 38px 22px 80px;
    }

    .hero {
      padding: 38px 0 28px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.22em;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 86px);
      line-height: 0.92;
      letter-spacing: -0.06em;
      max-width: 970px;
    }

    .hero p {
      margin: 28px 0 0;
      max-width: 920px;
      color: var(--muted);
      font-size: clamp(18px, 3.5vw, 31px);
      line-height: 1.45;
    }

    .nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 28px 0 18px;
    }

    .nav a,
    .btn,
    .input,
    .select,
    .check {
      min-height: 54px;
      border: 1px solid var(--line);
      background: rgba(7, 16, 28, 0.72);
      color: var(--text);
      border-radius: 18px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.015);
    }

    .nav a.active,
    .btn.primary {
      background: linear-gradient(135deg, rgba(130, 87, 255, 0.95), rgba(111, 91, 255, 0.78));
      border-color: rgba(180, 140, 255, 0.7);
    }

    .btn {
      cursor: pointer;
    }

    .btn.danger {
      border-color: rgba(255, 95, 130, 0.55);
      color: #ff8fa4;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 22px 0 28px;
      align-items: center;
    }

    .input,
    .select {
      justify-content: flex-start;
      width: 170px;
      color: var(--text);
    }

    .input input,
    .select select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .select select option {
      background: #0b1320;
      color: var(--text);
    }

    .check {
      cursor: pointer;
      color: var(--soft);
      user-select: none;
    }

    .check input {
      width: 20px;
      height: 20px;
      accent-color: var(--blue);
    }

    .updateLine {
      color: var(--muted);
      font-size: 15px;
      margin: 8px 0 28px;
      line-height: 1.55;
    }

    .section {
      margin-top: 34px;
    }

    .sectionHead {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }

    .sectionHead h2 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: -0.04em;
    }

    .sectionHead p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .countPill {
      color: var(--muted);
      font-size: 20px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card,
    .metric,
    .familyCard,
    .tableWrap {
      border: 1px solid var(--line);
      background: rgba(7, 16, 28, 0.78);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .metric {
      padding: 26px 28px;
      min-height: 148px;
    }

    .metric .label {
      color: var(--muted);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .metric .value {
      font-size: clamp(34px, 6vw, 58px);
      letter-spacing: -0.04em;
      font-weight: 900;
      line-height: 1;
    }

    .metric .sub {
      margin-top: 16px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .value.good,
    .txtGood {
      color: var(--good);
    }

    .value.bad,
    .txtBad {
      color: var(--bad);
    }

    .value.warn,
    .txtWarn {
      color: var(--warn);
    }

    .familiesGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .familyCard {
      padding: 28px;
      position: relative;
    }

    .familyTop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .familyId {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 950;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 17px;
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status.HOT {
      color: var(--warn);
      border-color: rgba(255, 216, 102, 0.55);
      background: rgba(255, 216, 102, 0.08);
    }

    .status.GOOD {
      color: var(--good);
      border-color: rgba(116, 240, 174, 0.45);
      background: rgba(116, 240, 174, 0.08);
    }

    .status.STABLE {
      color: var(--blue);
      border-color: rgba(118, 183, 255, 0.45);
      background: rgba(118, 183, 255, 0.08);
    }

    .status.COLLECTING {
      color: var(--warn);
      border-color: rgba(255, 216, 102, 0.42);
      background: rgba(255, 216, 102, 0.07);
    }

    .status.BAD {
      color: var(--bad);
      border-color: rgba(255, 113, 141, 0.42);
      background: rgba(255, 113, 141, 0.06);
    }

    .status.EMPTY {
      color: var(--muted);
      border-color: rgba(148, 163, 184, 0.25);
      background: rgba(148, 163, 184, 0.05);
    }

    .miniGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .mini {
      border: 1px solid var(--line2);
      background: rgba(0, 0, 0, 0.16);
      border-radius: 18px;
      padding: 16px;
      min-height: 96px;
    }

    .mini .k {
      color: var(--muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .mini .v {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .definition {
      color: var(--soft);
      font-size: 15px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      margin: 16px 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .chip {
      border: 1px solid var(--line2);
      color: var(--soft);
      background: rgba(255,255,255,0.025);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    .tableWrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 1260px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 18px 18px;
      border-bottom: 1px solid var(--line2);
      vertical-align: top;
      text-align: left;
    }

    th {
      color: var(--muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 950;
      background: rgba(7, 16, 28, 0.92);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    td {
      color: var(--soft);
      font-size: 15px;
      line-height: 1.45;
    }

    td.familyCell {
      color: var(--text);
      font-weight: 950;
      font-size: 18px;
      white-space: nowrap;
    }

    td.defCell {
      width: 420px;
      max-width: 420px;
      overflow-wrap: anywhere;
      color: var(--soft);
    }

    td.num {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

      border:

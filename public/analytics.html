<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runner Analytics Desk</title>

  <link rel="stylesheet" href="main.css">

  <style>
    :root {
      --runner: #8b5cf6;
      --runner-soft: rgba(139, 92, 246, 0.12);
      --runner-border: rgba(139, 92, 246, 0.35);
    }

    .muted {
      color: var(--muted);
    }

    .header h1 {
      color: #a78bfa;
      margin: 0 0 4px;
      font-size: 28px;
    }

    #statusLine {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .nav {
      display: flex;
      gap: 5px;
      margin-bottom: 24px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .btn.active.purple {
      background: var(--runner);
      color: #fff;
      border-color: var(--runner);
    }

    .runner-card {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid var(--runner-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .runner-title {
      color: #a78bfa;
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .runner-subtitle {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin: -8px 0 16px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px;
      min-height: 62px;
    }

    .metric-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric-box strong {
      font-size: 18px;
      color: #fff;
      word-break: break-word;
    }

    .metric-box strong.good {
      color: var(--green);
    }

    .metric-box strong.bad {
      color: var(--red);
    }

    .runner-advice {
      background: rgba(139, 92, 246, 0.14);
      border-left: 4px solid var(--runner);
      border-radius: 4px 12px 12px 4px;
      padding: 12px;
      margin-bottom: 14px;
      color: #e2e8f0;
      line-height: 1.5;
      font-size: 13px;
    }

    .runner-advice strong {
      color: #c4b5fd;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .runner-section-label {
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 900;
      color: #a78bfa;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .telemetry-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .telemetry-card {
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.16);
      border-radius: 12px;
      padding: 14px;
    }

    .telemetry-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .telemetry-name {
      font-weight: 900;
      font-size: 13px;
      color: #e2e8f0;
      word-break: break-word;
    }

    .telemetry-badge {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid rgba(139, 92, 246, 0.3);
      white-space: nowrap;
    }

    .telemetry-advice {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .side-title {
      font-size: 20px;
      font-weight: 900;
      margin: 32px 0 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      letter-spacing: 1px;
    }

    .analysis-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .a-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .a-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--muted);
    }

    .a-total {
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .a-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .a-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .a-stat-label {
      color: var(--muted);
    }

    .a-stat-val {
      font-weight: 900;
      font-size: 14px;
    }

    .a-stat-val.good {
      color: var(--green);
    }

    .a-stat-val.bad {
      color: var(--red);
    }

    .advice-content {
      display: none;
      margin-top: 12px;
      background: rgba(139, 92, 246, 0.1);
      border-left: 4px solid var(--runner);
      padding: 12px 14px;
      border-radius: 4px 12px 12px 4px;
      font-size: 13px;
      line-height: 1.6;
    }

    .advice-content strong {
      color: #a78bfa;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .advice-toggle-btn {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      color: #a78bfa;
      width: 100%;
      padding: 10px;
      text-align: center;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
      margin-top: 10px;
    }

    .advice-toggle-btn:hover {
      background: rgba(139, 92, 246, 0.18);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-top: 10px;
    }

    .runner-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 900px;
    }

    .runner-table th,
    .runner-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    .runner-table th {
      color: #a78bfa;
      background: rgba(139, 92, 246, 0.08);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-size: 11px;
    }

    .runner-table td {
      color: #e5e7eb;
    }

    .runner-table tr:last-child td {
      border-bottom: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }

    .pill.good {
      color: var(--green);
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.10);
    }

    .pill.bad {
      color: var(--red);
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.10);
    }

    .pill.runner {
      color: #c4b5fd;
      border-color: rgba(139,92,246,0.35);
      background: rgba(139,92,246,0.12);
    }

    #globalAdvice {
      display: none;
      background: var(--panel);
      border: 1px solid var(--runner);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 5px 20px rgba(139, 92, 246, 0.15);
    }

    #globalAdviceLabel {
      font-size: 12px;
      letter-spacing: 2px;
      color: #a78bfa;
      margin-bottom: 8px;
      font-weight: 900;
    }

    #globalAdviceContent {
      color: #e2e8f0;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 800;
    }

    @media (max-width: 720px) {
      .header h1 {
        font-size: 22px;
      }

      .nav {
        flex-wrap: wrap;
      }

      .btn {
        flex: 1 1 30%;
      }

      .metric-grid,
      .a-stats {
        grid-template-columns: 1fr;
      }

      .telemetry-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="pageShell">

    <div class="header">
      <h1>🚀 RUNNER ANALYTICS DESK</h1>
      <div id="statusLine">Laden...</div>

      <div class="nav">
        <a href="index.html" class="btn">Home</a>
        <a href="bull.html" class="btn">Bull</a>
        <a href="bear.html" class="btn">Bear</a>
        <a href="signals.html" class="btn">Runner</a>
        <a href="analytics.html" class="btn active purple">Analyse</a>
      </div>
    </div>

    <div class="trade-section">

      <div id="globalAdvice">
        <div id="globalAdviceLabel">🧠 RUNNER STATUS</div>
        <div id="globalAdviceContent"></div>
      </div>

      <div id="runnerTelemetry" class="runner-card">
        <h2 class="runner-title">🚀 Runner Telemetry Engine</h2>
        <p class="muted">Runner telemetry laden...</p>
      </div>

      <div id="runnerPerformance" class="runner-card">
        <h2 class="runner-title">📊 Runner Performance</h2>
        <p class="muted">Runner performance laden...</p>
      </div>

      <div id="analytics">
        <p style="color:var(--muted); text-align:center; margin-top:40px;">
          Scanner funnel analytics ophalen...
        </p>
      </div>

    </div>
  </div>

  <script src="analytics.js"></script>
</body>
</html>

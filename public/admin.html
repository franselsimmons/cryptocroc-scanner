<!-- ================= FILE: public/admin.html ================= -->
<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LONG Micro-Family Trading Admin</title>

  <style>
    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --soft: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --dark: #0f172a;
      --red: #dc2626;
      --green: #16a34a;
      --blue: #2563eb;
      --amber: #d97706;
      --purple: #7c3aed;
      --shadow: 0 2px 12px rgba(15, 23, 42, 0.07);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(22, 163, 74, 0.13), transparent 26%),
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.10), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    button,
    select,
    input { font: inherit; }

    button {
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 10px 14px;
      background: white;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    button.primary { background: var(--dark); color: white; border-color: var(--dark); }
    button.long-action,
    button.success { background: var(--green); color: white; border-color: var(--green); }
    button.danger { background: var(--red); color: white; border-color: var(--red); }
    button.warn { background: var(--amber); color: white; border-color: var(--amber); }
    button.small { padding: 6px 9px; font-size: 12px; border-radius: 9px; }

    input,
    select {
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 10px 12px;
      background: white;
      color: var(--text);
      min-height: 42px;
    }

    input[type="search"] { min-width: 320px; }

    header {
      background: linear-gradient(135deg, #052e16 0%, #065f46 45%, #0f172a 100%);
      color: white;
      padding: 24px;
    }

    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      font-weight: 900;
      box-shadow: 0 12px 32px rgba(22, 163, 74, 0.35);
    }

    .brand-title strong {
      display: block;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    .brand-subtitle {
      color: #bbf7d0;
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.45;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #dcfce7;
      font-size: 13px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(243, 245, 249, 0.86);
      backdrop-filter: blur(14px);
      padding: 10px 0;
    }

    .tab {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
    }

    .tab.active {
      background: var(--dark);
      color: white;
      border-color: var(--dark);
    }

    .hidden { display: none !important; }

    .message {
      border-radius: 16px;
      padding: 13px 15px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      background: white;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
    }

    .message.ok { color: #166534; background: #dcfce7; border-color: #bbf7d0; }
    .message.error { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
    .message.warn { color: #92400e; background: #fef3c7; border-color: #fde68a; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #334155;
    }

    .metric-card {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .metric-value {
      font-size: 27px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.04em;
      word-break: break-word;
    }

    .metric-extra {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin: 22px 0 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.03em;
    }

    .section-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin: 12px 0 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .pill.long,
    .pill.bull,
    .pill.active { background: #dcfce7; color: #166534; }

    .pill.short,
    .pill.bear,
    .pill.danger { background: #fee2e2; color: #991b1b; }

    .pill.warn { background: #fef3c7; color: #92400e; }
    .pill.info { background: #dbeafe; color: #1d4ed8; }
    .pill.purple { background: #ede9fe; color: #5b21b6; }
    .pill.dark { background: #0f172a; color: white; }

    .coin-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .coin-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: #94a3b8;
    }

    .coin-card.long::before,
    .coin-card.bull::before { background: linear-gradient(90deg, #16a34a, #22c55e); }

    .coin-card.short::before,
    .coin-card.bear::before { background: linear-gradient(90deg, #dc2626, #fb7185); }

    .coin-head {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .coin-logo {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: #e2e8f0;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #334155;
      flex: 0 0 auto;
    }

    .coin-main { min-width: 0; }

    .coin-symbol {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .coin-name {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    .coin-price {
      margin-left: auto;
      text-align: right;
    }

    .coin-price strong { display: block; font-size: 15px; }
    .coin-price span { display: block; font-size: 12px; color: var(--muted); }

    .coin-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .coin-stat {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px;
    }

    .coin-stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 3px;
    }

    .coin-stat strong { font-size: 13px; }

    .coin-foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      overflow: hidden;
    }

    .score-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .score-bar > span {
      display: block;
      height: 100%;
      width: var(--w);
      background: linear-gradient(90deg, #16a34a, #22c55e);
      border-radius: inherit;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 1300px;
      background: white;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid var(--border);
      padding: 10px;
      font-size: 13px;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: #334155;
      font-weight: 850;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td { background: #f8fafc; }

    code {
      font-size: 12px;
      background: #f1f5f9;
      padding: 3px 5px;
      border-radius: 6px;
      color: #334155;
      white-space: nowrap;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b1020;
      color: #e5e7eb;
      padding: 14px;
      border-radius: 16px;
      max-height: 520px;
      overflow: auto;
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.48;
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border2);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
    }

    @media (max-width: 1180px) {
      .grid,
      .coin-grid { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
      .grid-3 { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      header { padding: 18px 14px; }
      .header-inner { flex-direction: column; }
      main { padding: 14px; }
      .grid,
      .coin-grid { grid-template-columns: 1fr; }
      .tab { flex: 1 1 auto; padding: 9px 10px; }
      input[type="search"] { min-width: 100%; }
      .coin-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">
        <div class="brand-logo">MF</div>
        <div>
          <strong>LONG Micro-Family Trading Admin</strong>
          <div class="brand-subtitle">Scanner → TradeSystem → Analyze → LONG Micro Rotation → Discord</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="live-pill"><span class="live-dot"></span><span id="liveLabel">Live dashboard</span></div>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="overview">Overview</button>
      <button type="button" class="tab" data-tab="scanner">Scanner</button>
      <button type="button" class="tab" data-tab="trade">TradeSystem</button>
      <button type="button" class="tab" data-tab="micros">MicroFamilies</button>
      <button type="button" class="tab" data-tab="rotation">Rotation</button>
      <button type="button" class="tab" data-tab="discord">Discord Logs</button>
      <button type="button" class="tab" data-tab="reset">Reset</button>
    </div>

    <div id="message"></div>

    <section id="overview" class="panel"></section>
    <section id="scanner" class="panel hidden"></section>
    <section id="trade" class="panel hidden"></section>
    <section id="micros" class="panel hidden"></section>
    <section id="rotation" class="panel hidden"></section>
    <section id="discord" class="panel hidden"></section>
    <section id="reset" class="panel hidden"></section>
  </main>

  <script>
    const TARGET_TRADE_SIDE = "LONG";
    const TARGET_DASHBOARD_SIDE = "bull";
    const OPPOSITE_TRADE_SIDE = "SHORT";

    const state = {
      activeTab: "overview",
      overview: null,
      scanner: null,
      trade: null,
      micros: null,
      rotation: null,
      discord: null,
      microMode: "balanced",
      microSearch: "",
      apiTimeoutMs: 24000
    };

    const endpoints = {
      overview: "/api/admin/overview",
      scanner: "/api/admin/scanner",
      trade: "/api/admin/trade",
      micros: "/api/admin/micro-families",
      rotation: "/api/admin/rotation",
      discord: "/api/admin/discord-logs",
      runScanner: "/api/scanner/run?force=true",
      runTrade: "/api/trade/run?force=true",
      weeklyFreeze: "/api/analyze/weekly-freeze?force=true",
      resetLearning: "/api/admin/reset-learning",
      resetRotation: "/api/admin/reset-rotation",
      factoryReset: "/api/admin/factory-reset"
    };

    const tabs = ["overview", "scanner", "trade", "micros", "rotation", "discord", "reset"];

    const $ = (id) => document.getElementById(id);

    class ApiError extends Error {
      constructor(message, details = {}) {
        super(message);
        this.name = "ApiError";
        this.status = details.status || 0;
        this.url = details.url || "";
        this.data = details.data || null;
        this.raw = details.raw || "";
        this.timeout = Boolean(details.timeout);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function upper(value) {
      return String(value ?? "").trim().toUpperCase();
    }

    function normalizeSide(value) {
      const raw = upper(value);

      if (["LONG", "BULL", "BULLISH", "BUY"].includes(raw)) return "LONG";
      if (["SHORT", "BEAR", "BEARISH", "SELL"].includes(raw)) return "SHORT";

      return raw || "UNKNOWN";
    }

    function compactText(value) {
      return upper(value).replace(/\s+/g, "");
    }

    function sideHaystack(row = {}) {
      if (typeof row === "string") return row;

      if (!row || typeof row !== "object") return "";

      return [
        row.familyId,
        row.family,
        row.baseFamilyId,

        row.microFamilyId,
        row.trueMicroFamilyId,
        row.liveMicroFamilyId,
        row.realMicroFamilyId,
        row.executionMicroFamilyId,
        row.coarseMicroFamilyId,
        row.baseMicroFamilyId,
        row.legacyMicroFamilyId,
        row.id,
        row.key,

        row.macroFamilyId,
        row.parentMacroFamilyId,
        row.parentMicroFamilyId,
        row.parentFamilyId,
        row.familyMacroId,
        row.macroId,

        row.definition,
        row.microDefinition,
        row.macroDefinition,
        row.parentDefinition,

        ...(Array.isArray(row.definitionParts) ? row.definitionParts : []),
        ...(Array.isArray(row.microDefinitionParts) ? row.microDefinitionParts : []),
        ...(Array.isArray(row.macroDefinitionParts) ? row.macroDefinitionParts : []),
        ...(Array.isArray(row.parentDefinitionParts) ? row.parentDefinitionParts : []),
        ...(Array.isArray(row.executionFingerprintParts) ? row.executionFingerprintParts : [])
      ]
        .map(upper)
        .filter(Boolean)
        .join("|");
    }

    function hardIdHaystack(row = {}) {
      if (typeof row === "string") return row;

      if (!row || typeof row !== "object") return "";

      return [
        row.familyId,
        row.family,
        row.baseFamilyId,
        row.microFamilyId,
        row.trueMicroFamilyId,
        row.liveMicroFamilyId,
        row.realMicroFamilyId,
        row.executionMicroFamilyId,
        row.coarseMicroFamilyId,
        row.baseMicroFamilyId,
        row.legacyMicroFamilyId,
        row.id,
        row.key,
        row.macroFamilyId,
        row.parentMacroFamilyId,
        row.parentMicroFamilyId,
        row.parentFamilyId,
        row.familyMacroId,
        row.macroId
      ]
        .map(upper)
        .filter(Boolean)
        .join("|");
    }

    function hasHardShortSignal(value) {
      const text = compactText(value);

      if (!text) return false;

      return (
        text.includes("MICRO_SHORT_") ||
        text.includes("MICRO_SHORT_SHORT_") ||
        text.includes("SHORT_SHORT_") ||
        text.includes("FAMILY=SHORT") ||
        text.includes("TRADESIDE=SHORT") ||
        text.includes("TRADE_SIDE=SHORT") ||
        text.includes("SIDE=SHORT") ||
        text.includes("SIDE=BEAR") ||
        text.includes("DIRECTION=SHORT") ||
        text.includes("DIRECTION=BEAR") ||
        text.includes("SIDE=SELL") ||
        text.includes("DIRECTION=SELL") ||
        /(^|[|_=\-:])SHORT([|_=\-:]|$)/.test(text) ||
        /(^|[|_=\-:])BEAR([|_=\-:]|$)/.test(text) ||
        /(^|[|_=\-:])SELL([|_=\-:]|$)/.test(text)
      );
    }

    function hasHardLongSignal(value) {
      const text = compactText(value);

      if (!text) return false;

      return (
        text.includes("MICRO_LONG_") ||
        text.includes("MICRO_LONG_LONG_") ||
        text.includes("LONG_LONG_") ||
        text.includes("FAMILY=LONG") ||
        text.includes("TRADESIDE=LONG") ||
        text.includes("TRADE_SIDE=LONG") ||
        text.includes("SIDE=LONG") ||
        text.includes("SIDE=BULL") ||
        text.includes("DIRECTION=LONG") ||
        text.includes("DIRECTION=BULL") ||
        text.includes("SIDE=BUY") ||
        text.includes("DIRECTION=BUY") ||
        /(^|[|_=\-:])LONG([|_=\-:]|$)/.test(text) ||
        /(^|[|_=\-:])BULL([|_=\-:]|$)/.test(text) ||
        /(^|[|_=\-:])BUY([|_=\-:]|$)/.test(text)
      );
    }

    function hasShortFamilyId(row = {}) {
      return hasHardShortSignal(hardIdHaystack(row));
    }

    function hasLongFamilyId(row = {}) {
      return hasHardLongSignal(hardIdHaystack(row));
    }

    function inferTradeSideFromText(value) {
      const text = sideHaystack(value);
      const longHit = hasHardLongSignal(text);
      const shortHit = hasHardShortSignal(text);

      if (shortHit && !longHit) return "SHORT";
      if (longHit && !shortHit) return "LONG";

      if (shortHit && longHit) {
        const hardIds = hardIdHaystack(value);

        if (hasHardShortSignal(hardIds)) return "SHORT";
        if (hasHardLongSignal(hardIds)) return "LONG";

        return "UNKNOWN";
      }

      return "UNKNOWN";
    }

    function inferTradeSide(row = {}) {
      if (typeof row === "string") return inferTradeSideFromText(row);

      if (!row || typeof row !== "object") return "UNKNOWN";

      if (hasShortFamilyId(row)) return "SHORT";
      if (hasLongFamilyId(row)) return "LONG";

      const textSide = inferTradeSideFromText(row);

      if (textSide === "SHORT" || textSide === "LONG") return textSide;

      const direct = normalizeSide(
        row.tradeSide ||
        row.positionSide ||
        row.direction ||
        row.signalSide ||
        row.scannerSide ||
        row.analysisSide ||
        row.actualScannerSide ||
        row.entrySide ||
        row.side
      );

      if (direct === "LONG" || direct === "SHORT") return direct;

      return "UNKNOWN";
    }

    function isTargetSide(row = {}) {
      if (hasShortFamilyId(row)) return false;

      return inferTradeSide(row) === TARGET_TRADE_SIDE;
    }

    function isOppositeSide(row = {}) {
      return hasShortFamilyId(row) || inferTradeSide(row) === OPPOSITE_TRADE_SIDE;
    }

    function targetRows(rows = []) {
      return (Array.isArray(rows) ? rows : [])
        .filter((row) => row && typeof row === "object")
        .filter(isTargetSide);
    }

    function sideClass(row = {}) {
      const side = inferTradeSide(row);

      if (side === "LONG") return "long";
      if (side === "SHORT") return "short";

      return "neutral";
    }

    function baseSymbol(input) {
      const raw = typeof input === "string"
        ? input
        : input?.symbol || input?.baseSymbol || input?.coin || input?.contractSymbol || "";

      let symbol = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "");

      for (const suffix of ["USDTUMCBL", "USDCUMCBL", "USDTPERP", "USDCPERP", "USDT", "USDC", "BUSD", "PERP", "SWAP", "USD"]) {
        if (symbol.endsWith(suffix) && symbol.length > suffix.length) {
          symbol = symbol.slice(0, -suffix.length);
          break;
        }
      }

      return symbol || "COIN";
    }

    function microId(row = {}) {
      return (
        row.trueMicroFamilyId ||
        row.microFamilyId ||
        row.liveMicroFamilyId ||
        row.realMicroFamilyId ||
        row.executionMicroFamilyId ||
        row.id ||
        row.key ||
        ""
      );
    }

    function macroId(row = {}) {
      return (
        row.parentMacroFamilyId ||
        row.macroFamilyId ||
        row.parentMicroFamilyId ||
        row.legacyMicroFamilyId ||
        row.coarseMicroFamilyId ||
        row.familyMacroId ||
        row.familyId ||
        ""
      );
    }

    function familyId(row = {}) {
      return row.familyId || row.family || "";
    }

    function numericValue(row = {}, keys = [], fallback = 0) {
      for (const key of keys) {
        const value = row?.[key];
        const n = Number(value);

        if (Number.isFinite(n)) return n;
      }

      return fallback;
    }

    function maxNumericValue(row = {}, keys = [], fallback = 0) {
      const values = keys
        .map((key) => Number(row?.[key]))
        .filter(Number.isFinite);

      if (!values.length) return fallback;

      return Math.max(...values);
    }

    function obsCount(row = {}) {
      return maxNumericValue(row, [
        "obs",
        "observations",
        "observationCount",
        "observationsCount",
        "seen",
        "seenCount",
        "inputRows",
        "totalSeen",
        "sample",
        "samples",
        "shadowSeen",
        "shadowCreated",
        "shadowCreatedRows"
      ], 0);
    }

    function completedCount(row = {}) {
      const direct = maxNumericValue(row, [
        "completed",
        "weightedCompleted",
        "completedCount",
        "closed",
        "closedCount",
        "outcomes",
        "outcomesCount",
        "resolved",
        "resolvedCount",
        "winrateSample"
      ], 0);

      if (direct > 0) return direct;

      const wins = Number(row.wins);
      const losses = Number(row.losses);
      const breakeven = Number(row.breakeven || row.be || 0);

      if (Number.isFinite(wins) || Number.isFinite(losses)) {
        return Math.max(0, (Number.isFinite(wins) ? wins : 0) + (Number.isFinite(losses) ? losses : 0) + (Number.isFinite(breakeven) ? breakeven : 0));
      }

      return 0;
    }

    function pendingShadowCount(row = {}) {
      const explicit = maxNumericValue(row, [
        "pending",
        "pendingCount",
        "pendingShadow",
        "pendingShadows",
        "pendingShadowCount",
        "openShadow",
        "openShadows",
        "openShadowCount",
        "shadowOpen",
        "shadowOpenCount",
        "shadowPending",
        "shadowPendingCount"
      ], 0);

      if (explicit > 0) return explicit;

      const obs = obsCount(row);
      const completed = completedCount(row);

      if (obs > completed) return obs - completed;

      return 0;
    }

    function microStatus(row = {}) {
      const completed = completedCount(row);
      const pending = pendingShadowCount(row);
      const obs = obsCount(row);

      if (completed > 0) return "OUTCOME_READY";
      if (pending > 0) return "SHADOW_PENDING";
      if (obs > 0) return "OBSERVED";

      return "NO_DATA";
    }

    function renderCompletedCell(row = {}) {
      const completed = completedCount(row);
      const pending = pendingShadowCount(row);

      if (completed > 0) {
        return `<span class="pill active">${escapeHtml(fmt(completed, 2))}</span>`;
      }

      if (pending > 0) {
        return `<span class="pill warn">0 / ${escapeHtml(fmtInt(pending))} pending</span>`;
      }

      return `<span class="pill danger">0</span>`;
    }

    function renderMicroStatusCell(row = {}) {
      const status = microStatus(row);

      if (status === "OUTCOME_READY") return `<span class="pill active">${status}</span>`;
      if (status === "SHADOW_PENDING") return `<span class="pill warn">${status}</span>`;
      if (status === "OBSERVED") return `<span class="pill info">${status}</span>`;

      return `<span class="pill danger">${status}</span>`;
    }

    function setMessage(message = "", type = "") {
      if (!message) {
        $("message").innerHTML = "";
        return;
      }

      $("message").innerHTML = `<div class="message ${escapeAttr(type)}">${escapeHtml(message)}</div>`;
    }

    function timeoutSignal(timeoutMs = state.apiTimeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      return {
        signal: controller.signal,
        clear: () => clearTimeout(timer)
      };
    }

    function errorReason(data, fallback = "REQUEST_FAILED") {
      const raw = data?.error || data?.reason || data?.message || fallback;

      if (typeof raw === "string") return raw;
      if (raw && typeof raw === "object") return JSON.stringify(raw);

      return String(raw || fallback);
    }

    function friendlyApiMessage(error) {
      const status = Number(error?.status || 0);
      const raw = String(error?.message || error || "");

      if (error?.timeout) return "API-timeout: request is afgebroken door de admin UI.";
      if (status === 504 || raw.includes("504")) return "Backend timeout op deze route.";
      if (status === 500) return "Backend error op deze route. Check server logs.";
      if (status === 404) return "Admin endpoint niet gevonden. Controleer routepad/deploy.";

      return raw || "Onbekende API fout.";
    }

    async function api(url, options = {}) {
      const headers = {
        accept: "application/json",
        ...(options.headers || {})
      };

      if (options.body !== undefined && options.body !== null && !headers["content-type"]) {
        headers["content-type"] = "application/json";
      }

      const timeout = timeoutSignal(options.timeoutMs || state.apiTimeoutMs);

      try {
        const response = await fetch(url, {
          cache: "no-store",
          ...options,
          headers,
          signal: options.signal || timeout.signal
        });

        const rawText = await response.text();

        let data = {};

        try {
          data = rawText ? JSON.parse(rawText) : {};
        } catch {
          data = { raw: rawText };
        }

        if (!response.ok) {
          throw new ApiError(
            `${response.status} ${errorReason(data, response.statusText)}`,
            {
              status: response.status,
              url,
              data,
              raw: rawText
            }
          );
        }

        return data;
      } catch (error) {
        if (error?.name === "AbortError") {
          throw new ApiError("REQUEST_ABORTED_TIMEOUT", {
            status: 0,
            url,
            timeout: true
          });
        }

        if (error instanceof ApiError) throw error;

        throw new ApiError(error?.message || String(error), {
          status: 0,
          url
        });
      } finally {
        timeout.clear();
      }
    }

    async function safeApi(url, fallback = null, options = {}) {
      try {
        return await api(url, options);
      } catch {
        return fallback;
      }
    }

    function showLoading(tabId, label = "Laden...") {

    function fmt(value, decimals = 3) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n.toFixed(decimals);
    }

    function fmtInt(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "0";
      return Math.round(n).toLocaleString();
    }

    function fmtPctRatio(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return `${(n * 100).toFixed(1)}%`;
    }

    function fmtPctRaw(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return `${n.toFixed(2)}%`;
    }

    function fmtPrice(value) {
      const n = Number(value);

      if (!Number.isFinite(n)) return "-";
      if (n >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
      if (n >= 1) return n.toLocaleString(undefined, { maximumFractionDigits: 4 });

      return n.toLocaleString(undefined, { maximumFractionDigits: 8 });
    }

    function fmtMoneyLike(value) {
      const n = Number(value);

      if (!Number.isFinite(n)) return "-";
      if (Math.abs(n) >= 1_000_000_000) return `${(n / 1_000_000_000).toFixed(2)}B`;
      if (Math.abs(n) >= 1_000_000) return `${(n / 1_000_000).toFixed(2)}M`;
      if (Math.abs(n) >= 1_000) return `${(n / 1_000).toFixed(1)}K`;

      return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function fmtTs(value) {
      if (!value) return "-";

      const n = Number(value);
      const date = Number.isFinite(n) ? new Date(n) : new Date(value);

      if (Number.isNaN(date.getTime())) return "-";

      return date.toLocaleString();
    }

    function ageText(ts) {
      const n = Number(ts);

      if (!Number.isFinite(n) || n <= 0) return "-";

      const sec = Math.max(0, Math.floor((Date.now() - n) / 1000));

      if (sec < 60) return `${sec}s geleden`;
      if (sec < 3600) return `${Math.floor(sec / 60)}m geleden`;

      return `${Math.floor(sec / 3600)}u geleden`;
    }

    function jsonBlock(data) {
      return `<pre>${escapeHtml(JSON.stringify(data ?? null, null, 2))}</pre>`;
    }

    function metricCard(label, value, extra = "") {
      return `

    function scoreBar(value, max = 100) {
      const n = Math.max(0, Math.min(100, (Number(value) / max) * 100 || 0));
      return `<div class="score-bar"><span style="--w:${n.toFixed(1)}%"></span></div>`;
    }

    function table(rows, cols, emptyText = "Geen data.") {
      if (!Array.isArray(rows) || rows.length === 0) {
        return `<div class="empty">${escapeHtml(emptyText)}</div>`;
      }

      const head = cols
        .map((column) => `<th>${escapeHtml(column.label)}</th>`)
        .join("");

      const body = rows.map((row, index) => {
        const cells = cols.map((column) => {
          const value = column.render
            ? column.render(row, index)
            : escapeHtml(row?.[column.key]);

          return `<td>${value}</td>`;
        }).join("");

        return `<tr>${cells}</tr>`;
      }).join("");

      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${head}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function getRows(data, keys = []) {
      if (Array.isArray(data)) return data;

      for (const key of keys) {
        if (Array.isArray(data?.[key])) return data[key];
      }

      if (Array.isArray(data?.rows)) return data.rows;
      if (Array.isArray(data?.items)) return data.items;
      if (Array.isArray(data?.data)) return data.data;

      return [];
    }

    function deepArrays(value, depth = 0, out = []) {
      if (!value || depth > 8) return out;

      if (Array.isArray(value)) {
        out.push(value);
        return out;
      }

      if (typeof value !== "object") return out;

      for (const child of Object.values(value)) {
        deepArrays(child, depth + 1, out);
      }

      return out;
    }

    function deepCandidateArrays(value, depth = 0, out = []) {
      if (!value || depth > 7) return out;

      if (Array.isArray(value)) {
        const candidateLike = value.some((row) => (
          row &&
          typeof row === "object" &&
          (
            row.symbol ||
            row.baseSymbol ||
            row.contractSymbol ||
            row.scannerScore !== undefined ||
            row.moveScore !== undefined ||
            row.scannerReason
          )
        ));

        if (candidateLike) out.push(value);

        return out;
      }

      if (typeof value !== "object") return out;

      for (const [key, child] of Object.entries(value)) {
        if (key === "candidates" && Array.isArray(child)) {
          out.push(child);
          continue;
        }

        deepCandidateArrays(child, depth + 1, out);
      }

      return out;
    }

    function unwrapScanPayload(data = {}) {
      if (data?.result?.result?.candidates) return data.result.result;
      if (data?.result?.result?.result?.candidates) return data.result.result.result;
      if (data?.result?.candidates) return data.result;
      if (data?.snapshot?.candidates) return data.snapshot;
      if (data?.latestSnapshot?.candidates) return data.latestSnapshot;
      if (data?.latest?.candidates) return data.latest;
      if (data?.candidates) return data;

      return data;
    }

    function scannerCandidates(data = {}) {
      const payload = unwrapScanPayload(data);

      if (Array.isArray(payload.candidates)) return payload.candidates;

      const arrays = deepCandidateArrays(data);
      const targetFirst = arrays
        .map((rows) => ({
          rows,
          targetCount: targetRows(rows).length,
          length: rows.length
        }))
        .sort((a, b) => {
          if (b.targetCount !== a.targetCount) return b.targetCount - a.targetCount;
          return b.length - a.length;
        })[0];

      return Array.isArray(targetFirst?.rows) ? targetFirst.rows : [];
    }

    function microRowLike(row = {}) {
      if (!row || typeof row !== "object") return false;

      return Boolean(
        row.microFamilyId ||
        row.trueMicroFamilyId ||
        row.liveMicroFamilyId ||
        row.realMicroFamilyId ||
        row.executionMicroFamilyId ||
        row.familyId ||
        row.family ||
        row.macroFamilyId ||
        row.parentMacroFamilyId ||
        row.definition ||
        row.parentDefinition ||
        row.seen !== undefined ||
        row.obs !== undefined ||
        row.completed !== undefined ||
        row.winrate !== undefined ||
        row.avgR !== undefined ||
        row.totalR !== undefined
      );
    }

    function extractMicroRows(data = {}) {
      const preferredKeys = [
        "best25MicroFamilies",
        "topMicroFamilies",
        "bestMicroFamilies",
        "longRows",
        "bullRows",
        "activeMicroFamilies",
        "microFamilies",
        "micros",
        "rows",
        "items",
        "data"
      ];

      const directRows = [];

      for (const key of preferredKeys) {
        if (Array.isArray(data?.[key]) && data[key].length) {
          directRows.push(...data[key]);
        }
      }

      if (data?.result && typeof data.result === "object") {
        for (const key of preferredKeys) {
          if (Array.isArray(data.result?.[key]) && data.result[key].length) {
            directRows.push(...data.result[key]);
          }
        }
      }

      const deepRows = deepArrays(data)
        .filter((rows) => rows.some(microRowLike))
        .flat();

      const combined = [...directRows, ...deepRows]
        .filter(microRowLike)
        .filter((row) => !hasShortFamilyId(row))
        .filter(isTargetSide);

      const byId = new Map();

      for (const row of combined) {
        const id = microId(row) || `${macroId(row)}:${familyId(row)}:${JSON.stringify(row.definitionParts || row.definition || "")}`;

        if (!id) continue;

        const previous = byId.get(id);

        if (!previous) {
          byId.set(id, row);
          continue;
        }

        const previousScore = completedCount(previous) * 1000 + obsCount(previous);
        const currentScore = completedCount(row) * 1000 + obsCount(row);

        if (currentScore >= previousScore) {
          byId.set(id, row);
        }
      }

      return [...byId.values()]
        .sort((a, b) => {
          const scoreA = Number(a.dashboardBalancedScore ?? a.balancedScore ?? 0);
          const scoreB = Number(b.dashboardBalancedScore ?? b.balancedScore ?? 0);

          if (scoreB !== scoreA) return scoreB - scoreA;

          const completedDiff = completedCount(b) - completedCount(a);
          if (completedDiff !== 0) return completedDiff;

          return obsCount(b) - obsCount(a);
        });
    }

    function extractRotationIds(rotation = {}) {
      return [
        ...(Array.isArray(rotation.microFamilyIds) ? rotation.microFamilyIds : []),
        ...(Array.isArray(rotation.activeMicroFamilyIds) ? rotation.activeMicroFamilyIds : []),
        ...(Array.isArray(rotation.trueMicroFamilyIds) ? rotation.trueMicroFamilyIds : []),
        ...(Array.isArray(rotation.ids) ? rotation.ids : [])
      ]
        .filter(Boolean)
        .filter((id) => !hasHardShortSignal(id))
        .filter((id) => hasHardLongSignal(id));
    }

        setMessage(label, "ok");

      const confirmValue = $("factoryConfirm").value.trim();
      const forceValue = $("factoryForce").checked;

      if (confirmValue !== "FACTORY_RESET_CONFIRMED") {
        setMessage("Factory reset geblokkeerd: bevestiging is niet exact FACTORY_RESET_CONFIRMED.", "error");
        return;
      }

      if (!confirm("FACTORY RESET wist alles. Doorgaan?")) return;

      try {
        const data = await api(endpoints.factoryReset, {
          method: "POST",
          timeoutMs: 30000,
          body: JSON.stringify({
            confirm: "FACTORY_RESET_CONFIRMED",
            confirmed: "FACTORY_RESET_CONFIRMED",
            force: forceValue,
            forceClosePositions: forceValue
          })
        });

        $("resetResult").textContent = JSON.stringify(data, null, 2);
        setMessage("Factory reset uitgevoerd.", "ok");
      } catch (error) {
        setMessage(friendlyApiMessage(error), "warn");
      }
    }

    function renderSoftError(tab, error) {
      const message = friendlyApiMessage(error);

      setMessage(message, "warn");

      $(tab).innerHTML = `
        <div class="card">
          <h3>Niet geladen</h3>
          <div class="empty">${escapeHtml(message)}</div>
        </div>
      `;
    }

    async function refresh(tab = state.activeTab) {
      setMessage("");
      $("liveLabel").textContent = `Last refresh ${new Date().toLocaleTimeString()}`;

      try {
        if (tab === "overview") return await renderOverview();
        if (tab === "scanner") return await renderScanner();
        if (tab === "trade") return await renderTrade();
        if (tab === "micros") return await renderMicros();
        if (tab === "rotation") return await renderRotation();
        if (tab === "discord") return await renderDiscord();
        if (tab === "reset") return renderReset();
      } catch (error) {
        renderSoftError(tab, error);
      }
    }

    function showTab(id) {
      if (!tabs.includes(id)) id = "overview";

      state.activeTab = id;

      document.querySelectorAll(".panel").forEach((panel) => panel.classList.add("hidden"));
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));

      $(id).classList.remove("hidden");
      document.querySelector(`[data-tab="${id}"]`)?.classList.add("active");

      location.hash = id;
      refresh(id);
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => showTab(button.dataset.tab));
    });

    $("refreshBtn").addEventListener("click", () => refresh(state.activeTab));

    window.addEventListener("error", (event) => {
      setMessage(event.message || "Browser error", "error");
    });

    window.addEventListener("unhandledrejection", (event) => {
      setMessage(friendlyApiMessage(event.reason), "warn");
    });

    const initialTab = location.hash.replace("#", "") || "overview";
    showTab(tabs.includes(initialTab) ? initialTab : "overview");
  </script>
</body>
</html>

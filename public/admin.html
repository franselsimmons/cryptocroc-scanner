<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LONG 75 Micro-Family Learning Admin</title>


  <style>
    :root {
         --bg: #f3f5f9;
         --panel: #ffffff;
         --panel-soft: #f8fafc;
         --text: #0f172a;
         --muted: #64748b;
         --border: #e2e8f0;
         --border-strong: #cbd5e1;
         --dark: #0f172a;
         --green: #16a34a;
         --red: #dc2626;
         --amber: #d97706;
         --blue: #2563eb;
         --purple: #7c3aed;
         --cyan: #0891b2;
         --shadow: 0 2px 12px rgba(15, 23, 42, 0.07);
         font-family: Inter, ui-sans-serif, system-ui, -apple-system,
BlinkMacSystemFont, "Segoe UI", sans-serif;
    }


    * { box-sizing: border-box; }


    body {
         margin: 0;
         color: var(--text);
         background:
           radial-gradient(circle at top left, rgba(22, 163, 74, 0.12), transparent
30%),
           radial-gradient(circle at top right, rgba(15, 23, 42, 0.12), transparent
32%),
           var(--bg);
    }


    button,
    select,
    input,
    textarea {
        font: inherit;
    }


    button {
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 10px 14px;
        background: white;
        color: var(--text);
        cursor: pointer;
        transition: 0.14s ease;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }


    button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
    }


    button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
    }


    button.primary { background: var(--dark); color: white; border-color: var(--
dark); }
    button.success { background: var(--green); color: white; border-color: var(--
green); }
    button.warn { background: var(--amber); color: white; border-color: var(--
amber); }
    button.danger { background: var(--red); color: white; border-color: var(--
red); }
    button.long-action { background: var(--green); color: white; border-color:
var(--green); }
    button.small { padding: 6px 9px; border-radius: 9px; font-size: 12px; }


    select,
    input,
    textarea {
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 10px 12px;
        background: white;
        color: var(--text);
        min-height: 42px;
}


input[type="search"] { min-width: 340px; }


textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    line-height: 1.45;
}


header {
    background: linear-gradient(135deg, #0f172a 0%, #111827 46%, #14532d 100%);
    color: white;
    padding: 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}


.header-inner {
    max-width: 1540px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: flex-start;
}


.brand-title {
    display: flex;
    align-items: center;
    gap: 12px;
}


.brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #16a34a, #86efac);
    box-shadow: 0 12px 32px rgba(22, 163, 74, 0.30);
    font-weight: 900;
    letter-spacing: -0.04em;
}


.brand-title strong {
    display: block;
    font-size: 24px;
    line-height: 1.12;
    letter-spacing: -0.03em;
}


.brand-subtitle {
    color: #cbd5e1;
    margin-top: 6px;
    font-size: 14px;
    line-height: 1.45;
}


.header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
}


.live-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
    font-size: 13px;
}


.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #86efac;
    box-shadow: 0 0 0 4px rgba(134, 239, 172, 0.18);
}


main {
    max-width: 1540px;
    margin: 0 auto;
    padding: 20px;
}


.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(243, 245, 249, 0.88);
    backdrop-filter: blur(14px);
    padding: 10px 0;
}


.tab {
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.80);
    border-color: rgba(203, 213, 225, 0.90);
}


.tab.active {
    background: var(--dark);
    color: white;
    border-color: var(--dark);
}


.hidden,
.panel.hidden { display: none; }


.message {
    border-radius: 16px;
    padding: 13px 15px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    background: white;
    box-shadow: var(--shadow);
    white-space: pre-wrap;
}


.message.ok { color: #166534; background: #dcfce7; border-color: #bbf7d0; }
.message.error { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
.message.warn { color: #92400e; background: #fef3c7; border-color: #fde68a; }


.grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
}
.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
}


.coin-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
}


.card {
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}


.card h3 {
    margin: 0 0 10px;
    font-size: 14px;
    color: #334155;
}


.metric-card {
    min-height: 112px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}


.metric-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
}


.metric-value {
    font-size: 26px;
    line-height: 1.1;
    font-weight: 850;
    letter-spacing: -0.04em;
    word-break: break-word;
}


.metric-extra {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
    line-height: 1.45;
}


.section-title {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    margin: 22px 0 10px;
}


.section-title h2 {
    margin: 0;
    font-size: 18px;
    letter-spacing: -0.02em;
}


.section-title p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
}


.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    align-items: center;
    margin: 12px 0 14px;
}


.pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #e2e8f0;
    color: #334155;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    white-space: nowrap;
}


.pill.active { background: #dcfce7; color: #166534; }
.pill.long { background: #dcfce7; color: #166534; }
.pill.danger { background: #fee2e2; color: #991b1b; }
.pill.warn { background: #fef3c7; color: #92400e; }
.pill.info { background: #dbeafe; color: #1d4ed8; }
.pill.purple { background: #ede9fe; color: #5b21b6; }
.pill.dark { background: #0f172a; color: white; }
.pill.soft { background: #e0f2fe; color: #075985; }
.pill.observation { background: #fef9c3; color: #854d0e; }
.pill.raw { background: #f1f5f9; color: #475569; }
.pill.fit { background: #dcfce7; color: #166534; }
.pill.weakfit { background: #ccfbf1; color: #0f766e; }
.pill.neutral { background: #f1f5f9; color: #475569; }
.pill.misfit { background: #fee2e2; color: #991b1b; }
.pill.passed { background: #dcfce7; color: #166534; }
.pill.veto { background: #7f1d1d; color: #ffffff; }
.pill.blocked { background: #fee2e2; color: #991b1b; }


.score-bar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
}


.score-bar > span {
    display: block;
    height: 100%;
    width: var(--w);
    background: linear-gradient(90deg, #dc2626, #fca5a5);
    border-radius: inherit;
}


.table-wrap {
    width: 100%;
    overflow-x: auto;
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
}


table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1560px;
    background: white;
}


th,
td {
    text-align: left;
    border-bottom: 1px solid var(--border);
    padding: 10px;
    font-size: 13px;
    vertical-align: middle;
    white-space: nowrap;
}


th {
    background: #f8fafc;
    color: #334155;
    font-weight: 800;
    position: sticky;
    top: 0;
    z-index: 1;
}


tr:hover td { background: #f8fafc; }


code {
    font-size: 12px;
    background: #f1f5f9;
    padding: 3px 5px;
    border-radius: 6px;
    color: #334155;
    white-space: nowrap;
}


pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #0b1020;
    color: #e5e7eb;
    padding: 14px;
        border-radius: 16px;
        max-height: 520px;
        overflow: auto;
        margin: 0 0 10px;
        font-size: 12px;
        line-height: 1.48;
    }


    .api-url-box {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        margin-bottom: 10px;
    }


    .api-url-box code {
        white-space: normal;
        word-break: break-all;
    }


    .api-output-textarea {
        width: 100%;
        min-height: 360px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
"Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
        background: #0b1020;
        color: #e5e7eb;
        border: 1px solid #1e293b;
        border-radius: 16px;
        padding: 14px;
        white-space: pre;
        user-select: all;
    }


    .api-output-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    margin-bottom: 10px;
}


.api-output-head h3 {
    margin: 0;
}


.copy-big {
    background: var(--dark);
    color: white;
    border-color: var(--dark);
    font-weight: 800;
}


.micro-desktop-table table {
    min-width: 1180px;
}


.micro-id-cell {
    max-width: 360px;
    white-space: normal;
    word-break: break-word;
}


.micro-id-cell code {
    white-space: normal;
    word-break: break-all;
    line-height: 1.5;
}


.micro-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}


.micro-mobile-cards {
    display: none;
}


.micro-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
}


.micro-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
}


.micro-card-title {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.03em;
}


.micro-id-button {
    width: 100%;
    text-align: left;
    padding: 10px;
    border-radius: 14px;
    margin: 8px 0;
    background: #f8fafc;
}


.micro-id-button code {
    white-space: normal;
    word-break: break-all;
    line-height: 1.55;
    font-size: 12px;
}


.micro-stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 10px;
}


.micro-stat-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 9px;
}


.micro-stat-box span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 4px;
}


.micro-stat-box strong {
    display: block;
    font-size: 14px;
    word-break: break-word;
}


    .winner-hero {
        background: linear-gradient(135deg, #052e16 0%, #14532d 55%, #166534 100%);
        color: white;
        border: 0;
    }

    .winner-hero h2,
    .winner-hero h3 {
        color: white;
    }

    .winner-hero .metric-extra {
        color: #dcfce7;
    }

    .winner-filter-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(170px, 1fr));
        gap: 10px;
        align-items: end;
    }

    .winner-filter-field label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .winner-filter-field select,
    .winner-filter-field input {
        width: 100%;
        min-width: 0;
    }

    .winner-check {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background: white;
        font-size: 13px;
        font-weight: 800;
    }

    .winner-check input {
        min-height: auto;
        width: 18px;
        height: 18px;
    }

    .winner-selection-bar {
        position: sticky;
        bottom: 10px;
        z-index: 4;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px;
        margin: 14px 0;
        border: 1px solid #86efac;
        border-radius: 16px;
        background: rgba(240, 253, 244, 0.96);
        box-shadow: 0 12px 34px rgba(20, 83, 45, 0.18);
        backdrop-filter: blur(12px);
    }

    .winner-selection-count {
        font-size: 15px;
        font-weight: 900;
        color: #166534;
    }

    .temporal-chip-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        max-width: 520px;
    }

    .temporal-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        padding: 5px 7px;
        border-radius: 9px;
        font-size: 10px;
        font-weight: 900;
        border: 1px solid transparent;
        cursor: default;
    }

    .temporal-chip.proven {
        color: #14532d;
        background: #bbf7d0;
        border-color: #86efac;
    }

    .temporal-chip.positive {
        color: #166534;
        background: #dcfce7;
        border-color: #bbf7d0;
    }

    .temporal-chip.learning {
        color: #854d0e;
        background: #fef9c3;
        border-color: #fde68a;
    }

    .temporal-chip.blocked,
    .temporal-chip.negative {
        color: #991b1b;
        background: #fee2e2;
        border-color: #fecaca;
    }

    .temporal-chip.confounded {
        color: #6b21a8;
        background: #f3e8ff;
        border-color: #e9d5ff;
    }

    .temporal-chip.unknown,
    .temporal-chip.neutral {
        color: #475569;
        background: #f1f5f9;
        border-color: #e2e8f0;
    }

    .temporal-profile-box {
        min-width: 170px;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 9px;
        background: #f8fafc;
    }

    .temporal-profile-box strong {
        display: block;
        margin-bottom: 5px;
    }

    .temporal-profile-meta {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
    }

    .winner-verdict {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 11px;
        font-weight: 950;
        white-space: nowrap;
    }

    .winner-verdict.proven {
        color: white;
        background: #15803d;
    }

    .winner-verdict.positive {
        color: #14532d;
        background: #bbf7d0;
    }

    .winner-verdict.selectable {
        color: #075985;
        background: #e0f2fe;
    }

    .winner-verdict.blocked {
        color: white;
        background: #991b1b;
    }

    .winner-verdict.learning,
    .winner-verdict.unknown {
        color: #854d0e;
        background: #fef3c7;
    }

    .winner-table table {
        min-width: 1920px;
    }

    .winner-family-cell {
        max-width: 420px;
        white-space: normal;
    }

    .winner-family-cell code {
        white-space: normal;
        word-break: break-all;
    }

    .winner-mobile-cards {
        display: none;
    }

    .winner-card {
        border-left: 5px solid #cbd5e1;
    }

    .winner-card.proven { border-left-color: #16a34a; }
    .winner-card.positive { border-left-color: #86efac; }
    .winner-card.blocked { border-left-color: #dc2626; }
    .winner-card.learning { border-left-color: #f59e0b; }

    .winner-context-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin-bottom: 8px;
    }

    .winner-explain {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 10px;
    }

    .winner-explain > div {
        padding: 10px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: #f8fafc;
        font-size: 12px;
        line-height: 1.5;
    }

    .composition-plan-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(260px, 1fr));
        gap: 14px;
        margin: 14px 0;
    }

    .composition-plan-card {
        position: relative;
        border: 2px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        background: white;
        cursor: pointer;
        transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .composition-plan-card:hover {
        transform: translateY(-2px);
        border-color: #86efac;
        box-shadow: 0 12px 30px rgba(15, 118, 110, .10);
    }

    .composition-plan-card.selected {
        border-color: #15803d;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, .13);
    }

    .composition-plan-card.active::after {
        content: "ACTIEF";
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 5px 8px;
        border-radius: 999px;
        background: #15803d;
        color: white;
        font-size: 10px;
        font-weight: 950;
    }

    .composition-plan-rank {
        display: inline-flex;
        min-width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #ecfdf5;
        color: #166534;
        font-weight: 950;
        margin-right: 7px;
    }

    .composition-plan-metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
    }

    .composition-plan-metrics > div,
    .composition-mini-stat {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 9px;
        background: #f8fafc;
    }

    .composition-plan-metrics span,
    .composition-mini-stat span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 3px;
    }

    .composition-plan-metrics strong,
    .composition-mini-stat strong {
        font-size: 14px;
    }

    .composition-weather-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 12px 0;
    }

    .composition-weather-tab {
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: white;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 900;
    }

    .composition-weather-tab.selected {
        color: white;
        background: #166534;
        border-color: #166534;
    }

    .composition-weather-tab.disabled-weather {
        color: #991b1b;
        background: #fee2e2;
        border-color: #fecaca;
        text-decoration: line-through;
    }

    .composition-grid-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: white;
    }

    .composition-grid {
        width: 100%;
        min-width: 2460px;
        border-collapse: separate;
        border-spacing: 3px;
        padding: 5px;
    }

    .composition-grid th {
        position: sticky;
        top: 0;
        z-index: 2;
        min-width: 92px;
        padding: 6px;
        background: #f8fafc;
        font-size: 10px;
        text-align: center;
    }

    .composition-grid th:first-child,
    .composition-grid td:first-child {

function uniqueStrings(values = []) {
    const stack = Array.isArray(values) ? [...values] : [values];
    const out = [];


    while (stack.length) {
        const value = stack.shift();


        if (Array.isArray(value)) {
            stack.unshift(...value);
            continue;
        }


        if (typeof value === "string") {
            out.push(...value.split(/[\s,;\n\r]+/g));
            continue;
        }


        if (value !== undefined && value !== null) out.push(value);
    }


    return [...new Set(
        out
            .map((value) => String(value || "").trim().toUpperCase())
            .filter(Boolean)
    )];
}

return "LONG";

return "SHORT";

    function fallbackCurrentFitScore(row = {}) {

    function canonicalCurrentFit(value = "") {

function currentFitScore(row = {}) {

    function recentMomentumScore(row = {}) {
        const direct = firstFinite(
             row.recentMomentumScore,
             row.momentumScore,
             row.recentScore,
             row.recentNetRScore
        );


        if (direct !== null) return direct;


        const recentRows = Array.isArray(row.recentOutcomes) ?
row.recentOutcomes.slice(-12) : [];


        if (!recentRows.length) return 0;


        const netR = recentRows.reduce((sum, outcome) => {
             return sum + num(outcome.longNetR ?? outcome.netLongR ?? outcome.netR ??
outcome.exitR ?? outcome.realizedR ?? outcome.r, 0);
        }, 0);


        const directSLPenalty = recentRows.filter((outcome) => outcome.directSL ||
outcome.directToSL).length * 6;
        const costPenalty = recentRows.reduce((sum, outcome) => sum + Math.max(0,
num(outcome.costR, 0)), 0) * 2;


        return clamp(netR * 8 - directSLPenalty - costPenalty, -80, 80);

    function timeoutSignal(timeoutMs = state.apiTimeoutMs) {
        const controller = new AbortController();

             signal: controller.signal,

    function noCacheUrl(url) {
        const join = String(url).includes("?") ? "&" : "?";
        return `${url}${join}_ts=${Date.now()}`;
    }


    async function api(url, options = {}) {
        const timeout = timeoutSignal(options.timeoutMs || state.apiTimeoutMs);
      const headers = {
           accept: "application/json",
           ...(options.headers || {})
      };


      if (options.body !== undefined && !headers["content-type"]) {
           headers["content-type"] = "application/json";
      }


      try {
           const response = await fetch(noCacheUrl(url), {
               cache: "no-store",
               ...options,
               headers,
               signal: options.signal || timeout.signal
           });


           const rawText = await response.text();


           let data = {};


           try {
               data = rawText ? JSON.parse(rawText) : {};
           } catch {
               data = { raw: rawText };
           }


           if (!response.ok) {
               throw new ApiError(`${response.status} ${data.error || data.reason ||
response.statusText}`, {
                 status: response.status,
                 url,
                 data
               });
           }


           return data;
      } catch (error) {
           if (error?.name === "AbortError") {
               throw new ApiError("REQUEST_ABORTED_TIMEOUT", {
                 status: 0,
                 url,
                 timeout: true
               });
           }


           if (error instanceof ApiError) throw error;
             throw new ApiError(error?.message || String(error), {
               status: 0,
               url
             });
        } finally {
             timeout.clear();
        }
    }

function extractObjectArrays(data, keys = []) {
    const rows = [];


    for (const key of keys) {
         const value = data?.[key];


         if (Array.isArray(value)) {
             rows.push(...value);
         } else if (value && typeof value === "object") {
             rows.push(...Object.values(value));
         }
    }


    return rows;
}


function extractDeepMicroRows(data) {
    const output = [];
    const seenObjects = new Set();
    const seenIds = new Set();


    function add(row) {
         if (!row || typeof row !== "object") return;
    const id = microId(row);


    if (!id || seenIds.has(id)) return;
    if (!isRealAnalyzeMicroRow(row)) return;


    seenIds.add(id);
    output.push(row);
}


function walk(value, depth = 0) {
    if (!value || typeof value !== "object" || depth > 7) return;
    if (seenObjects.has(value)) return;


    seenObjects.add(value);


    if (Array.isArray(value)) {
        for (const item of value) {
            if (item && typeof item === "object" && microId(item)) add(item);
            walk(item, depth + 1);
        }
        return;
    }


    if (microId(value)) add(value);


    for (const key of [
        "best75MicroFamilies",
        "top75MicroFamilies",
        "bestMicroFamilies",
        "topMicroFamilies",
        "longRows",
        "rows",
        "microFamilies",
        "micros",
        "items",
        "data",
        "result",
        "payload",
        "response",
        "activeRotation",
        "active",
        "balanced",
        "adaptive",
        "winrate",
        "totalR",
        "avgR",
        "directSL",
                 "observed"
             ]) {
                 walk(value[key], depth + 1);
             }
        }


        walk(data, 0);


        return output;
    }


    function extractMicroRowsFromApiPayload(data = {}) {
        const preferred = extractObjectArrays(data, [
             "best75MicroFamilies",
             "top75MicroFamilies",
             "bestMicroFamilies",
             "topMicroFamilies"
        ]);


        const direct = extractObjectArrays(data, [
             "longRows",
             "rows",
             "microFamilies",
             "micros",
             "items"
        ]);


        const nestedPreferred = [
             ...extractObjectArrays(data.result || {}, ["best75MicroFamilies",
"top75MicroFamilies", "bestMicroFamilies", "topMicroFamilies"]),
             ...extractObjectArrays(data.payload || {}, ["best75MicroFamilies",
"top75MicroFamilies", "bestMicroFamilies", "topMicroFamilies"])
        ];


        const deep = extractDeepMicroRows(data);


        const source = preferred.length
             ? preferred
             : nestedPreferred.length
                 ? nestedPreferred
                 : direct.length
                    ? direct
                    : deep;


        const byId = new Map();


        for (const row of source) {
         if (!row || typeof row !== "object") continue;
         if (!isRealAnalyzeMicroRow(row)) continue;


         const id = microId(row);
         if (!id || byId.has(id)) continue;


         byId.set(id, row);
    }


    if (byId.size === 0) {
         for (const row of deep) {
             const id = microId(row);
             if (!id || byId.has(id)) continue;


             byId.set(id, row);
         }
    }


    return [...byId.values()];
}


function compareNumberDesc(a, b) {

function compareNumberAsc(a, b) {

function compareBestDataFirst(a, b) {

         compareNumberDesc(sampleReliability(a), sampleReliability(b)) ||
         compareNumberDesc(fairWinrate(a), fairWinrate(b)) ||
         compareNumberAsc(avgCostR(a), avgCostR(b)) ||

           compareNumberDesc(currentFitConfidence(a), currentFitConfidence(b)) ||
           compareBestDataFirst(a, b)
      );
  }


  if (mode === "cost") {
      return (
           compareNumberAsc(avgCostR(a), avgCostR(b)) ||

  if (mode === "observed") {
      return (
           compareNumberDesc(observationSample(a), observationSample(b)) ||
           compareBestDataFirst(a, b)
      );
  }


  if (mode === "directSL") {
      return (
           compareNumberAsc(directSLPct(a), directSLPct(b)) ||
           compareBestDataFirst(a, b)

  }


  if (mode === "totalR") {
      return (
           compareNumberDesc(netTotalR(a), netTotalR(b)) ||
           compareBestDataFirst(a, b)
      );
  }


  if (mode === "avgR") {
      return (
                 compareNumberDesc(netAvgR(a), netAvgR(b)) ||
                 compareBestDataFirst(a, b)
            );
        }


        if (mode === "winrate") {
            return (

b.sampleWilsonLowerBound ?? b.wilsonLowerBound) ||
                 compareNumberDesc(a.sampleBayesianWinrate ?? a.bayesianWinrate,
b.sampleBayesianWinrate ?? b.bayesianWinrate) ||
                 compareNumberDesc(completed(a), completed(b)) ||
                 compareBestDataFirst(a, b)
            );
        }


        return compareBestDataFirst(a, b);

             }))
             .sort((a, b) => {

function extractMarketData(data = {}) {
  const source =
       data.marketWeather ||
       data.weather ||
       data.currentMarketWeather ||
       data.latest ||
       data.snapshot ||
       data;


  const universe =
       data.marketUniverse ||
       data.universe ||
       source.universe ||
       source.marketUniverse ||
       {};


  const createdAt = num(
       source.createdAt ||
       source.completedAt ||
       source.updatedAt ||
       source.ts ||
       universe.createdAt ||
       universe.updatedAt,
       0
  );


  const regime = upper(
       source.currentRegime ||
       source.regime ||
       source.marketRegime ||
       source.breadthRegime ||
       universe.currentRegime ||
       universe.regime ||
       "UNKNOWN"
  );


  const trendSide = upper(
       source.currentTrendSide ||
       source.trendSide ||
       source.marketSide ||
       source.side ||
       source.direction ||
       source.breadthSide ||
       universe.currentTrendSide ||
       universe.trendSide ||
       "UNKNOWN"
);


const bearishPct = firstFinite(
     source.bearishPct,
     source.shortPct,
     source.downPct,
     source.breadthBearishPct,
     source.universeBearishPct,
     universe.bearishPct,
     universe.shortPct,
     universe.downPct
);


const bullishPct = firstFinite(
     source.bullishPct,
     source.longPct,
     source.upPct,
     source.breadthBullishPct,
     source.universeBullishPct,
     universe.bullishPct,
     universe.longPct,
     universe.upPct
);


const squeezePct = firstFinite(
     source.squeezePct,
     source.compressionPct,
     source.breadthSqueezePct,
     universe.squeezePct,
     universe.compressionPct
);


const confidence = firstFinite(
     source.confidence,
     source.weatherConfidence,
     source.currentTrendConfidence,
     source.breadthConfidence,
     universe.confidence
);


return {
     raw: data,
     source,
     universe,
     ok: Boolean(data && Object.keys(data).length),
     createdAt,
     ageText: ageText(createdAt),
         regime,
         trendSide,
         bearishPct,
         bullishPct,
         squeezePct,
         confidence
    };
}

             const area = document.createElement("textarea");
             area.value = String(text || "");

             area.remove();
             setMessage(message, "ok");

        link.href = url;

acceptedMeasurementVersion,
             acceptedOutcomeMeasurementVersion: acceptedMeasurementVersion,
             exitFillModelVersion: row.exitFillModelVersion ||
data.exitFillModelVersion || EXIT_FILL_MODEL_VERSION,
             outcomeMeasurementGateMode: row.outcomeMeasurementGateMode ||
data.outcomeMeasurementGateMode || OUTCOME_MEASUREMENT_GATE_MODE,
             completedCurrentMeasurementOnly: row.completedCurrentMeasurementOnly ??
data.completedCurrentMeasurementOnly ?? true,
             legacyOutcomeMeasurementsExcluded: row.legacyOutcomeMeasurementsExcluded
?? data.legacyOutcomeMeasurementsExcluded ?? true
        }));
        const rows = rankMicroRows(rawRows, state.microMode);


        return {
             ...data,
             rows,
             rawExtractedRows: rawRows.length,
             activeMicroFamilyIds: uniqueStrings([
               data.activeMicroFamilyIds || [],
               data.selectedMicroFamilyIds || [],
               data.activeRotation?.activeMicroFamilyIds || [],

             ]).filter(idAllowedInLongOnly),

           data.activeRotation?.activeMacroFamilyIds || [],
           data.activeRotation?.macroFamilyIds || []
         ]).filter(parentIdAllowedInLongOnly)
    };
}


function currentMicroRows() {
    const rows = state.micros?.rows || [];
    const search = state.microSearch.trim().toLowerCase();


    const filtered = search
         ? rows.filter((row) => JSON.stringify(row).toLowerCase().includes(search))
         : rows;


    return rankMicroRows(filtered, state.microMode);
}


async function ensureMicrosLoaded() {
    if (state.micros?.rows?.length) return state.micros;


    try {
         state.micros = await fetchMicros();
    } catch {
         state.micros = state.micros || { rows: [] };
    }


    return state.micros;
}



    // OVERVIEW_COMMAND_CENTER_MOBILE_SAFE_V1_1
    // Read-only overview. Deliberately avoids loading the very large rotation/Discord payloads
    // and never recursively walks admin payloads. Detail tabs keep their existing full data.
    async function ccSafeCall(fn) {
        try {
            const data = await fn();
            return {
                ok: true,
                payloadOk: data?.ok !== false,
                data: data || {},
                error: null
            };
        } catch (error) {
            return {
                ok: false,
                payloadOk: false,
                data: {},
                error: friendlyApiMessage(error)
            };
        }
    }

    function ccClamp(value, min = 0, max = 100) {
        return Math.max(min, Math.min(max, Number(value) || 0));
    }

    function ccPct(value) {
        return `${Math.round(ccClamp(value))}%`;
    }

    function ccFinite(...values) {
        for (const value of values) {
            const n = Number(value);
            if (Number.isFinite(n)) return n;
        }
        return 0;
    }

    function ccTs(...values) {
        for (const value of values) {
            const n = Number(value);
            if (!Number.isFinite(n) || n <= 0) continue;
            return n < 10_000_000_000 ? n * 1000 : n;
        }
        return 0;
    }

    function ccAgeMinutes(ts) {
        return ts > 0 ? Math.max(0, (Date.now() - ts) / 60000) : null;
    }

    function ccExplicitBool(...values) {
        for (const value of values) {
            if (value === true || value === false) return value;
            const text = String(value ?? "").trim().toLowerCase();
            if (text === "true") return true;
            if (text === "false") return false;
        }
        return null;
    }

    function ccStatusLabel(status) {
        const map = {
            VERIFIED: "GEVERIFIEERD",
            RUNNING: "ACTIEF / LEREND",
            WAITING: "WACHT",
            LOCKED: "BEWUST GEBLOKKEERD",
            BLOCKED: "GEBLOKKEERD",
            STALLED: "BLIJFT HANGEN",
            ERROR: "FOUT"
        };
        return map[status] || status;
    }

    function ccStatusHtml(status) {
        return `<span class="cc-status ${escapeAttr(status)}">${escapeHtml(ccStatusLabel(status))}</span>`;
    }

    function ccLiveCompleted(row = {}) {
        const explicit = Math.max(
            0,
            num(row.virtualCompleted, 0) + num(row.shadowCompleted, 0),
            num(row.completedCurrentMeasurement, 0),
            num(row.liveCompleted, 0),
            num(row.liveOutcomeCount, 0)
        );
        if (explicit > 0) return explicit;
        if (row.historicalSelectionProjectionOnly === true) return 0;
        return Math.max(0, completed(row));
    }

    function ccHistoricalCompleted(row = {}) {
        return Math.max(
            0,
            num(row.historicalCompleted, 0),
            num(row.historicalOutcomeCount, 0),
            num(row.historicalOutcomes, 0),
            num(row.historicalSample, 0),
            num(row.selectionRow?.historicalCompleted, 0),
            num(row.selectionRow?.completed, 0)
        );
    }

    function ccArrayCount(value) {
        return Array.isArray(value) ? value.length : 0;
    }

    function ccIssue(severity, component, symptom, cause, consequence, action, tab = "overview", raw = "") {
        return { severity, component, symptom, cause, consequence, action, tab, raw };
    }

    function ccIssuePriority(severity) {
        return ({ ERROR: 0, BLOCKED: 1, STALLED: 2, WAITING: 3, LOCKED: 4 }[severity] ?? 9);
    }

    function ccScoreCard(label, score, detail) {
        const safe = Math.round(ccClamp(score));
        const tone = safe < 45 ? "danger" : safe < 75 ? "warn" : "";
        return `<div class="cc-score">
            <span class="label">${escapeHtml(label)}</span>
            <strong>${safe}%</strong>
            <div class="cc-progress ${tone}"><span style="width:${safe}%"></span></div>
            <small>${escapeHtml(detail)}</small>
        </div>`;
    }

    function ccStageCard(stage, index) {
        return `<button type="button" class="cc-stage ${escapeAttr(stage.status)}" data-cc-tab="${escapeAttr(stage.tab || "overview")}">
            <span class="num">${String(index + 1).padStart(2, "0")}</span>
            <strong>${escapeHtml(stage.label)}</strong>
            ${ccStatusHtml(stage.status)}
            <p>${escapeHtml(stage.detail || "")}</p>
        </button>`;
    }

    function ccIssueTable(issues = []) {
        const rows = issues.length ? issues.map((issue) => `<tr>
            <td>${ccStatusHtml(issue.severity)}</td>
            <td><strong>${escapeHtml(issue.component)}</strong>${issue.raw ? `<br><code>${escapeHtml(issue.raw)}</code>` : ""}</td>
            <td>${escapeHtml(issue.symptom)}</td>
            <td>${escapeHtml(issue.cause)}</td>
            <td>${escapeHtml(issue.consequence)}</td>
            <td>${escapeHtml(issue.action)}</td>
            <td><button type="button" class="cc-action-btn" data-cc-tab="${escapeAttr(issue.tab || "overview")}">Open</button></td>
        </tr>`).join("") : `<tr><td colspan="7"><strong>Geen actuele blokkade gedetecteerd.</strong><br><span class="metric-extra">Alle controleerbare modules leveren een gezonde status.</span></td></tr>`;
        return `<div class="cc-table-wrap"><table class="cc-table"><thead><tr>
            <th>Status</th><th>Onderdeel</th><th>Wat zien we?</th><th>Waarom?</th><th>Gevolg</th><th>Wat moet gebeuren?</th><th></th>
        </tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function ccNextSteps(issues = [], stages = []) {
        const actionable = issues
            .filter((row) => ["ERROR", "BLOCKED", "STALLED", "WAITING"].includes(row.severity))
            .sort((a, b) => ccIssuePriority(a.severity) - ccIssuePriority(b.severity))
            .slice(0, 4);
        const rows = actionable.length ? actionable : stages
            .filter((stage) => !["VERIFIED", "LOCKED"].includes(stage.status))
            .slice(0, 4)
            .map((stage) => ({ component: stage.label, action: stage.detail }));
        if (!rows.length) return `<div class="empty">Geen technische vervolgstap nodig. Het systeem kan verder leren en selecteren.</div>`;
        return `<div class="cc-next-list">${rows.map((row, index) => `<div class="cc-next-row">
            <span class="step">${index + 1}</span><div><strong>${escapeHtml(row.component)}</strong><span>${escapeHtml(row.action || "Verder laten draaien.")}</span></div>
        </div>`).join("")}</div>`;
    }

    function ccBindNavigation() {
        document.querySelectorAll("[data-cc-tab]").forEach((button) => {
            button.addEventListener("click", () => showTab(button.dataset.ccTab || "overview"));
        });
    }

    async function renderOverview() {
        showLoading("overview");

        // Keep Overview deliberately lightweight for mobile Safari. The heavy week-composition
        // and Discord-log payloads are loaded only when their own detail tabs are opened.
        const [overviewResult, microResult, marketResult, scannerResult, tradeResult] = await Promise.all([
            ccSafeCall(() => api(endpoints.overview)),
            ccSafeCall(() => fetchMicros()),
            ccSafeCall(() => fetchMarket()),
            ccSafeCall(() => api(endpoints.scanner)),
            ccSafeCall(() => api(endpoints.trade))
        ]);

        const data = overviewResult.data || {};
        const microData = microResult.data || { rows: [] };
        const market = marketResult.data || { ok: false, available: false, regime: "UNKNOWN", trendSide: "UNKNOWN" };
        const scannerData = scannerResult.data || {};
        const tradeData = tradeResult.data || {};

        state.overview = data;
        state.micros = microData;
        state.market = market;
        state.scanner = scannerData;
        state.trade = tradeData;

        const microRows = Array.isArray(microData.rows) ? microData.rows : [];
        const observing = microRows.filter((row) => learningStatus(row) === "OBSERVING").length;
        const early = microRows.filter((row) => learningStatus(row) === "EARLY_OUTCOMES").length;
        const activeLearning = microRows.filter((row) => learningStatus(row) === "ACTIVE_LEARNING").length;
        const gatePassed = microRows.filter((row) => activationGateStatus(row) === "PASSED").length;
        const empiricalVeto = microRows.filter((row) => isEmpiricalVeto(row)).length;
        const liveOutcomes = microRows.reduce((sum, row) => sum + ccLiveCompleted(row), 0);

        const historicalRows = microRows.filter((row) => (
            row.historicalStatus ||
            row.historicalEvidenceBridgeVersion ||
            row.historicalSelectionProjectionOnly === true ||
            ccHistoricalCompleted(row) > 0
        ));
        const historicalFromRows = historicalRows.reduce((sum, row) => sum + ccHistoricalCompleted(row), 0);
        const oosPassedFromRows = historicalRows.filter((row) => (
            upper(row.historicalStatus) === "OOS_PASSED" ||
            row.selectionEligible === true ||
            row.historicalSelectionEligible === true
        )).length;
        const forwardValidating = microRows.filter((row) => upper(row.forwardValidationStatus) === "FORWARD_VALIDATING").length;
        const forwardPassed = microRows.filter((row) => upper(row.forwardValidationStatus) === "PASSED").length;

        const scannerSnapshot = scannerData.snapshot || scannerData.latest || scannerData.latestScan || {};
        const rawCandidates = scannerSnapshot.candidates || scannerData.candidates || [];
        const scannerCandidates = ONLY_SIDE === "LONG" ? longRows(rawCandidates).length : shortRows(rawCandidates).length;
        const scannerTs = ccTs(scannerSnapshot.completedAt, scannerSnapshot.createdAt, scannerSnapshot.timestamp, scannerSnapshot.startedAt);
        const scannerAgeMin = ccAgeMinutes(scannerTs);
        const scannerStale = scannerAgeMin !== null && scannerAgeMin > 20;

        const runMeta = tradeData.runMeta || tradeData.lastRunMeta || tradeData.tradeMeta || {};
        const tradeTs = ccTs(runMeta.completedAt, runMeta.startedAt, runMeta.timestamp, runMeta.createdAt);
        const tradeAgeMin = ccAgeMinutes(tradeTs);
        const tradeStale = tradeAgeMin !== null && tradeAgeMin > 15;
        const startIndex = ccFinite(runMeta.candidateStartIndex, tradeData.candidateStartIndex, 0);
        const nextIndex = ccFinite(runMeta.nextCandidateIndex, tradeData.nextCandidateIndex, 0);
        const retryCount = ccFinite(runMeta.noProgressRetryCount, tradeData.noProgressRetryCount, 0);
        const progressAdvanced = ccExplicitBool(runMeta.snapshotProgressAdvanced, tradeData.snapshotProgressAdvanced);
        const entryIncomplete = ccExplicitBool(runMeta.entryProcessingIncomplete, tradeData.entryProcessingIncomplete);
        const tradeStalled = retryCount >= 2 && nextIndex <= startIndex && (progressAdvanced === false || entryIncomplete === true);
        const tradeSync = ccExplicitBool(tradeData.scannerAndTradeInSync);
        const openPositions = Math.max(
            ccArrayCount(tradeData.positions),
            ccArrayCount(tradeData.openPositions),
            ccArrayCount(tradeData.virtualPositions),
            ccFinite(data.openPositions, data.positionsCount, 0)
        );

        // Overview uses only compact selection fields already present in the overview/micro payloads.
        // It does NOT fetch /api/admin/rotation here because a 10,080-slot proposal can be very large.
        const activeRotation = data.activeRotation || microData.activeRotation || {};
        const activeIds = uniqueStrings([
            data.activeMicroFamilyIds || [],
            activeRotation.activeMicroFamilyIds || [],
            activeRotation.microFamilyIds || [],
            activeRotation.trueMicroFamilyIds || [],
            microData.activeMicroFamilyIds || []
        ]).filter((id) => ONLY_SIDE === "LONG" ? idAllowedInLongOnly(id) : idAllowedInShortOnly(id));

        const historicalMeta = data.historicalEvidence || data.historical || microData.historicalEvidence || {};
        const historicalOutcomes = Math.max(
            historicalFromRows,
            ccFinite(data.historicalOutcomes, data.historicalOutcomeCount, data.historicalCompleted, 0),
            ccFinite(historicalMeta.totalOutcomes, historicalMeta.historicalOutcomes, historicalMeta.completed, 0)
        );
        const oosPassed = Math.max(
            oosPassedFromRows,
            ccFinite(data.selectionEligibleFamilies, data.historicalSelectionEligibleFamilies, data.oosPassedFamilies, 0),
            ccFinite(historicalMeta.selectionEligibleFamilies, historicalMeta.eligibleFamilies, historicalMeta.oosPassedFamilies, 0)
        );
        const historicalEvidenceApplied = ccExplicitBool(
            data.historicalEvidenceApplied,
            historicalMeta.applied,
            microData.historicalEvidenceApplied
        );
        const historicalEvidenceReason = String(
            data.historicalEvidenceReason ||
            historicalMeta.reason ||
            microData.historicalEvidenceReason ||
            ""
        );
        const historicalVisible = historicalOutcomes > 0 || historicalRows.length > 0 || historicalEvidenceApplied === true;

        const activeComposition = data.activeWeekComposition || activeRotation.activeWeekComposition || null;
        const compositionSummary = activeComposition?.summary || data.weekCompositionSummary || {};
        const activeSlots = ccFinite(compositionSummary.activeSlots, data.activeCompositionSlots, 0);
        const proposalFamilies = ccFinite(compositionSummary.familyCount, data.weekCompositionFamilyCount, activeIds.length, 0);

        const overviewOk = overviewResult.ok && overviewResult.payloadOk;
        const marketOk = marketResult.ok && marketResult.payloadOk && market?.available !== false;
        const scannerApiOk = scannerResult.ok && scannerResult.payloadOk;
        const tradeApiOk = tradeResult.ok && tradeResult.payloadOk;
        const microsOk = microResult.ok && microResult.payloadOk;
        const scannerOk = scannerApiOk && !scannerStale;
        const tradeOk = tradeApiOk && !tradeStalled && !tradeStale;

        const issues = [];
        if (!overviewOk) {
            issues.push(ccIssue("ERROR", "Overview API", "De hoofdstatus kon niet betrouwbaar worden geladen.", overviewResult.error || String(data.reason || data.error || "API payload meldt ok=false."), "De totaalstatus is onvolledig.", "Controleer /api/admin/overview en de Vercel logs.", "overview", overviewResult.error || data.reason || data.error || "OVERVIEW_NOT_OK"));
        }
        if (!marketResult.ok || !marketResult.payloadOk) {
            issues.push(ccIssue("ERROR", "MarketWeather", "MarketWeather API reageert niet betrouwbaar.", marketResult.error || market.reason || "API-call/payload faalde.", "CurrentFit en contextdiagnose zijn onvolledig.", "Open marketWeather.js en controleer de laatste admin-output.", "market", marketResult.error || market.reason || "MARKET_WEATHER_NOT_OK"));
        } else if (!marketOk) {
            issues.push(ccIssue("BLOCKED", "MarketWeather", `MarketWeather is ${market.stale ? "stale" : "niet beschikbaar"}.`, market.reason || "Geen bruikbare actuele marketWeather payload.", "Contextfilters en BTC/weather selectie zijn niet volledig betrouwbaar.", "Ververs marketWeather en controleer brondata/timestamp.", "market", market.reason || "MARKET_WEATHER_UNAVAILABLE"));
        }

        if (!scannerApiOk) {
            issues.push(ccIssue("ERROR", "Scanner", "Scanner admin-output kon niet betrouwbaar worden geladen.", scannerResult.error || String(scannerData.reason || scannerData.error || "Scanner payload meldt ok=false."), "Nieuwe kandidaten zijn niet controleerbaar.", "Open Scanner en controleer /api/admin/scanner.", "scanner", scannerResult.error || scannerData.reason || scannerData.error || "SCANNER_NOT_OK"));
        } else if (scannerStale) {
            issues.push(ccIssue("STALLED", "Scanner", `Laatste snapshot is ongeveer ${Math.round(scannerAgeMin)} minuten oud.`, "De scannercron draait mogelijk niet of schrijft geen nieuwe latest snapshot.", "Nieuwe marktdata bereikt Analyze/Trade niet tijdig.", "Controleer de scannercron en voer één geforceerde scanner-run uit.", "scanner", scannerSnapshot.snapshotId || "STALE_SCANNER"));
        }

        if (!tradeApiOk) {
            issues.push(ccIssue("ERROR", "TradeSystem", "Trade admin-output kon niet betrouwbaar worden geladen.", tradeResult.error || String(tradeData.reason || tradeData.error || "Trade payload meldt ok=false."), "Entries, monitoring en outcomes zijn niet controleerbaar.", "Open TradeSystem en controleer /api/admin/trade.", "trade", tradeResult.error || tradeData.reason || tradeData.error || "TRADE_NOT_OK"));
        } else if (tradeStalled) {
            issues.push(ccIssue("STALLED", "Trade cursor", `Cursor maakt geen voortgang: ${startIndex} → ${nextIndex}, retries=${retryCount}.`, "Dezelfde batch wordt herhaald; meestal runtimebudget, te grote batch of een hardnekkige candidate.", "Een scanner-snapshot kan niet volledig worden verwerkt.", "Controleer runMeta/reason. Adaptive retry hoort de batch te verkleinen en de cursor daarna vooruit te zetten.", "trade", String(runMeta.reason || runMeta.skipReason || tradeData.reason || "NO_PROGRESS")));
        } else if (tradeStale) {
            issues.push(ccIssue("STALLED", "TradeSystem", `Laatste trade-run is ongeveer ${Math.round(tradeAgeMin)} minuten oud.`, "De tradecron draait mogelijk niet of runMeta wordt niet vernieuwd.", "Open posities worden mogelijk niet op schema gemonitord.", "Controleer de tradecron en laatste runMeta.", "trade", "TRADE_RUN_STALE"));
        }
        if (tradeSync === false && !tradeStalled) {
            issues.push(ccIssue("WAITING", "Scanner → Trade sync", "TradeSystem heeft de nieuwste scanner-snapshot nog niet volledig verwerkt.", "Er staat nog een snapshot/batch in de continuation queue.", "Nieuwe kandidaten wachten op verwerking.", "Laat de tradecron doorlopen; bij oplopende no-progress retries wordt dit STALLED.", "trade", "scannerAndTradeInSync=false"));
        }

        if (!microsOk) {
            issues.push(ccIssue("ERROR", "75 MicroFamilies", "Micro-family API kon niet betrouwbaar worden geladen.", microResult.error || String(microData.reason || microData.error || "Micro-family payload meldt ok=false."), "Learning, gates en selectie kunnen niet worden beoordeeld.", "Open 75 MicroFamilies en controleer de API.", "micros", microResult.error || microData.reason || microData.error || "MICROS_NOT_OK"));
        } else if (microRows.length === 0 && scannerCandidates > 0) {

        }

        if (!historicalVisible) {
            const severity = historicalEvidenceApplied === false && historicalEvidenceReason ? "BLOCKED" : "WAITING";
            issues.push(ccIssue(severity, "Historical evidence", "Nog geen geldige historische evidence zichtbaar in de live app.", historicalEvidenceReason || "De historische replay/evidence-export is nog niet gepubliceerd of nog niet door de selection bridge ingelezen.", "OOS en automatische beste-signalenkeuze blijven zonder historisch bewijs.", "Controleer Historical Action → generatedEvidence.js → Vercel deploy → weekly freeze/bridge.", "winners", historicalEvidenceReason || "NO_HISTORICAL_EVIDENCE_VISIBLE"));
        }
        if (historicalOutcomes > 0 && oosPassed === 0) {

        }
        if (oosPassed > 0 && activeIds.length === 0 && activeSlots === 0) {
            issues.push(ccIssue("BLOCKED", "Weekly selection", `${fmtInt(oosPassed)} OOS_PASSED families beschikbaar, maar nog geen actieve selectie zichtbaar.`, "De weekly generation/composition is nog niet opgebouwd of geactiveerd.", "Strict Discord blijft dicht ondanks bewezen historische kandidaten.", "Open Winnende signalen en controleer generation/composition.", "winners", "OOS_PASSED_BUT_NO_SELECTION"));
        }
        if (gatePassed === 0) {
            issues.push(ccIssue("LOCKED", "Strict Discord", "Nog geen live PASSED family.", `Strict publicatie vereist minimaal ${EMPIRICAL_VETO_MIN_COMPLETED} actuele live outcomes en positieve avgR.`, "Geen strict Discord-signalen; dit is bewust fail-closed.", "Live forward-validatie laten doorgroeien. Niet handmatig forceren.", "discord", "LIVE_FORWARD_GATE_NOT_PASSED"));
        } else if (activeIds.length === 0) {
            issues.push(ccIssue("LOCKED", "Strict Discord", `${gatePassed} live PASSED families, maar 0 geselecteerde exacte IDs.`, "Er is nog geen actieve strict selectie.", "Discord blijft stil.", "Controleer Winnende signalen of Manual Discord Selection.", "rotation", "PASSED_BUT_NOT_SELECTED"));
        }

        const technicalHealth = ccClamp(
            (overviewOk ? 20 : 0) +
            (marketOk ? 20 : 0) +
            (scannerOk ? 20 : 0) +
            (tradeOk ? 20 : 0) +
            (microsOk ? 20 : 0)
        );
        const learningProgress = ccClamp(
            (microRows.length > 0 ? 20 : 0) +
            (liveOutcomes > 0 ? 25 : 0) +
            (early + activeLearning + gatePassed + empiricalVeto > 0 ? 20 : 0) +
            (historicalOutcomes > 0 ? 25 : 0) +
            (oosPassed > 0 ? 10 : 0)
        );
        const selectionReadiness = ccClamp(
            (historicalOutcomes > 0 ? 35 : 0) +
            (oosPassed > 0 ? 35 : 0) +
            ((activeSlots > 0 || activeIds.length > 0) ? 30 : 0)
        );
        const discordReadiness = ccClamp(
            (gatePassed > 0 ? 45 : 0) +
            ((activeSlots > 0 || activeIds.length > 0) ? 25 : 0) +
            (activeIds.length > 0 ? 30 : 0)
        );
        const overallMaturity = ccClamp(
            technicalHealth * 0.35 + learningProgress * 0.30 + selectionReadiness * 0.25 + discordReadiness * 0.10
        );

        const stages = [
            { label: "Market data", status: marketOk ? "VERIFIED" : "BLOCKED", detail: marketOk ? `${market.regime || "UNKNOWN"} · ${market.trendSide || "UNKNOWN"}` : (market.reason || "MarketWeather niet bruikbaar"), tab: "market" },
            { label: "Scanner", status: !scannerApiOk ? "ERROR" : scannerStale ? "STALLED" : "VERIFIED", detail: `${fmtInt(scannerCandidates)} ${ONLY_SIDE} candidates${scannerAgeMin === null ? "" : ` · ${Math.round(scannerAgeMin)}m oud`}`, tab: "scanner" },
            { label: "Analyze 75", status: !microsOk ? "ERROR" : microRows.length ? "VERIFIED" : scannerCandidates ? "BLOCKED" : "RUNNING", detail: `${fmtInt(microRows.length)}/75 families zichtbaar`, tab: "micros" },
            { label: "Virtual trade", status: !tradeApiOk ? "ERROR" : tradeStalled || tradeStale ? "STALLED" : "VERIFIED", detail: `${fmtInt(openPositions)} open · cursor ${startIndex}→${nextIndex}`, tab: "trade" },
            { label: "Net-R outcomes", status: liveOutcomes > 0 ? "VERIFIED" : "RUNNING", detail: `${fmtInt(liveOutcomes)} live finalized outcomes`, tab: "micros" },
            { label: "Historical evidence", status: historicalOutcomes > 0 ? "VERIFIED" : historicalEvidenceApplied === false && historicalEvidenceReason ? "BLOCKED" : "WAITING", detail: `${fmtInt(historicalOutcomes)} historische outcomes zichtbaar`, tab: "winners" },
            { label: "OOS / walk-forward", status: oosPassed > 0 ? "VERIFIED" : historicalOutcomes > 0 ? "RUNNING" : "WAITING", detail: `${fmtInt(oosPassed)} OOS_PASSED families`, tab: "winners" },
            { label: "Weekly selection", status: activeSlots > 0 || activeIds.length > 0 ? "VERIFIED" : oosPassed > 0 ? "BLOCKED" : "WAITING", detail: `${fmtInt(activeSlots)} actieve vakken · ${fmtInt(proposalFamilies)} families`, tab: "winners" },
            { label: "Forward validation", status: forwardPassed > 0 ? "VERIFIED" : forwardValidating > 0 ? "RUNNING" : "WAITING", detail: `${fmtInt(forwardValidating)} validating · ${fmtInt(forwardPassed)} passed`, tab: "micros" },

    function temporalGateStats(profile = {}) {
        const source = profile?.gateWindow || profile?.windowStats || profile?.stats || {};
        return {
             completed: Math.max(0, num(source.completed, 0)),
             observations: Math.max(0, num(source.observations, source.completed || 0)),
             wins: Math.max(0, num(source.wins, 0)),
             losses: Math.max(0, num(source.losses, 0)),
             flats: Math.max(0, num(source.flats, 0)),
             avgNetR: firstFinite(source.avgNetR, source.avgR, source.averageNetR, 0) ?? 0,
             sumNetR: firstFinite(source.sumNetR, source.totalR, 0) ?? 0,
             lcb95: firstFinite(source.lcb95, source.oneSidedLcb95, source.lowerConfidenceBound),
             ucb95: firstFinite(source.ucb95, source.oneSidedUcb95, source.upperConfidenceBound),
             winrate: firstFinite(source.winrate, source.winRate, source.fairWinrate),
             qValue: firstFinite(
                  profile?.negativeTest?.qValue,
                  profile?.positiveTest?.qValue,
                  profile?.recoveryTest?.qValue,
                  source.qValue
             )
        };
    }


    function temporalProfileDecision(profile = {}) {
        return upper(
             profile?.activeDecision ||
             profile?.decision ||
             profile?.evaluationStatus ||
             "INHERIT_GLOBAL"
        );
    }


    function temporalProfileVisualState(profile = {}) {
        if (!profile || typeof profile !== "object") return "unknown";
        const decision = temporalProfileDecision(profile);
        const stats = temporalGateStats(profile);

        if (decision === "VETO_ACTIVE") return "blocked";
        if (decision.includes("CONFOUNDED")) return "confounded";
        if (stats.completed <= 0) return "unknown";
        if (stats.completed < EMPIRICAL_VETO_MIN_COMPLETED) return "learning";
        if (stats.avgNetR >= 0.05 && stats.lcb95 !== null && stats.lcb95 > 0) {
             return "proven";
        }
        if (stats.avgNetR > 0) return "positive";
        if (stats.avgNetR <= -0.10 && stats.ucb95 !== null && stats.ucb95 < 0) {
             return "negative";
        }
        return "neutral";
    }

    function weekendApprovalPill(projection = {}, day = "") {
        const normalizedDay = upper(day);
        if (!["SATURDAY", "SUNDAY"].includes(normalizedDay)) {
             return '<span class="pill neutral">Niet van toepassing</span>';

        const profile = weekendApproval(projection, normalizedDay);

    function profilePassesPositive(profile, { strict = false } = {}) {
        const stats = temporalGateStats(profile);
        if (temporalProfileDecision(profile) === "VETO_ACTIVE") return false;
        if (strict) {
             return stats.completed >= EMPIRICAL_VETO_MIN_COMPLETED &&
                  stats.avgNetR >= 0.05 &&
                  stats.lcb95 !== null &&
                  stats.lcb95 > 0;
        }
        return stats.completed >= MIN_COMPLETED_ACTIVE_LEARNING && stats.avgNetR > 0;
    }


    function winnerEligibility(row = {}, projection = null, context = selectedWinnerContext()) {
        const reasons = [];
        const globallyAllowed = discordSelectionAllowed(row);
        const fit = currentFit(row);
        const dayProfile = projection?.dayProfiles?.[context.day] || null;
        const sessionProfile = projection?.sessionProfiles?.[context.session] || null;
        const dayDecision = temporalProfileDecision(dayProfile);
        const sessionDecision = temporalProfileDecision(sessionProfile);

        if (!globallyAllowed) reasons.push(discordSelectionBlockReason(row));
        if (!projection) reasons.push("GEEN_TEMPORAL_PROJECTION");
        if (dayDecision === "VETO_ACTIVE") reasons.push(`DAG_VETO:${context.day}`);
        if (sessionDecision === "VETO_ACTIVE") reasons.push(`SESSIE_VETO:${context.session}`);
        if (!weekendApproved(projection || {}, context.day)) {
             reasons.push(`WEEKEND_NIET_GOEDGEKEURD:${context.day}`);
        }
        if (state.winnerOnlyCurrentFit && fit === "MISFIT") reasons.push("CURRENTFIT_MISFIT");

        let presetPassed = false;
        if (state.winnerPreset === "STRICT_PROVEN") {
             presetPassed = globallyAllowed &&
                  Boolean(projection) &&
                  profilePassesPositive(dayProfile, { strict: true }) &&
                  profilePassesPositive(sessionProfile, { strict: true }) &&
                  weekendApproved(projection, context.day) &&
                  (!state.winnerOnlyCurrentFit || fit !== "MISFIT");
             if (!profilePassesPositive(dayProfile, { strict: true })) reasons.push("DAG_NIET_BEWEZEN_POSITIEF");
             if (!profilePassesPositive(sessionProfile, { strict: true })) reasons.push("SESSIE_NIET_BEWEZEN_POSITIEF");
        } else if (state.winnerPreset === "BALANCED_POSITIVE") {
             presetPassed = globallyAllowed &&
                  Boolean(projection) &&
                  profilePassesPositive(dayProfile) &&
                  profilePassesPositive(sessionProfile) &&
                  weekendApproved(projection, context.day) &&
                  (!state.winnerOnlyCurrentFit || fit !== "MISFIT");
             if (!profilePassesPositive(dayProfile)) reasons.push("DAG_NOG_NIET_POSITIEF");
             if (!profilePassesPositive(sessionProfile)) reasons.push("SESSIE_NOG_NIET_POSITIEF");
        } else {
             presetPassed = globallyAllowed &&
                  Boolean(projection) &&
                  dayDecision !== "VETO_ACTIVE" &&
                  sessionDecision !== "VETO_ACTIVE" &&
                  weekendApproved(projection, context.day) &&
                  (!state.winnerOnlyCurrentFit || fit !== "MISFIT");
        }

        return {
             passed: presetPassed,
             globallyAllowed,
             projectionFound: Boolean(projection),
             fit,
             dayProfile,
             sessionProfile,
             reasons: uniqueStrings(reasons),
             context
        };
    }


    function winnerVerdict(eligibility = {}) {
        if (eligibility.passed && state.winnerPreset === "STRICT_PROVEN") {
             return { key: "proven", label: "BEWEZEN WINNAAR" };
        }
        if (eligibility.passed && state.winnerPreset === "BALANCED_POSITIVE") {
             return { key: "positive", label: "POSITIEF" };
        }
        if (eligibility.passed) {
             return { key: "selectable", label: "SELECTEERBAAR" };
        }
        if (eligibility.reasons.some((reason) => reason.includes("VETO") || reason.includes("NIET_GOEDGEKEURD"))) {
             return { key: "blocked", label: "GEBLOKKEERD" };
        }
        if (eligibility.reasons.some((reason) => reason.includes("NIET_BEWEZEN") || reason.includes("NOG_NIET"))) {
             return { key: "learning", label: "NOG LEREN" };
        }
        return { key: "unknown", label: "NIET SELECTEERBAAR" };
    }


    function winnerScore(row = {}, eligibility = {}) {
        const dayStats = temporalGateStats(eligibility.dayProfile);
        const sessionStats = temporalGateStats(eligibility.sessionProfile);
        return (
             (eligibility.passed ? 1_000_000 : 0) +
             adaptiveScore(row) * 100 +
             netAvgR(row) * 1_000 +
             Math.min(completed(row), 100) * 10 +
             dayStats.avgNetR * 2_000 +
             sessionStats.avgNetR * 2_000 +
             Math.min(dayStats.completed, 50) * 5 +
             Math.min(sessionStats.completed, 50) * 5 +
             currentFitScore(row)
        );
    }

    function compositionSlotKey(day, hourBucket, weatherKey, btcState = state.compositionSelectedBtc) {
        return `${upper(day)}:${upper(hourBucket)}|${upper(weatherKey)}|BTC:${upper(btcState)}`;
    }

    function parseCompositionSlotKey(value = "") {
        const raw = upper(value);
        const btcMarker = raw.lastIndexOf("|BTC:");
        const withoutBtc = btcMarker >= 0 ? raw.slice(0, btcMarker) : raw;
        const btcState = btcMarker >= 0 ? raw.slice(btcMarker + 5) : "UNKNOWN";
        const firstPipe = withoutBtc.indexOf("|");
        const dayHour = firstPipe >= 0 ? withoutBtc.slice(0, firstPipe) : withoutBtc;
        const weatherKey = firstPipe >= 0 ? withoutBtc.slice(firstPipe + 1) : "UNKNOWN";
        const [day, hourBucket] = dayHour.split(":");
        return { day, hourBucket, weatherKey, btcState };
    }

    function compositionWeatherBtcKey(weatherKey, btcState) {
        return `${upper(weatherKey)}|BTC:${upper(btcState)}`;
    }

    function compositionUnique(values = []) {
        return [...new Set((Array.isArray(values) ? values : [values])
          .map((value) => upper(value))
          .filter(Boolean))];
    }

    function compositionOverrides() {
        return {
          disabledDays: compositionUnique(state.compositionDisabledDays),
          disabledHours: compositionUnique(state.compositionDisabledHours),
          disabledWeatherKeys: compositionUnique(state.compositionDisabledWeatherKeys),
          disabledBtcStates: compositionUnique(state.compositionDisabledBtcStates),
          disabledWeatherBtcKeys: compositionUnique(state.compositionDisabledWeatherBtcKeys),
          disabledDayHours: compositionUnique(state.compositionDisabledDayHours),
          disabledSlotWeatherKeys: compositionUnique(state.compositionDisabledSlotWeatherKeys),
          disabledDayHourWeatherBtcKeys: compositionUnique(
            state.compositionDisabledDayHourWeatherBtcKeys
          )
        };
    }

    function setCompositionOverride(field, value, disabled) {
        const current = new Set(compositionUnique(state[field] || []));
        const normalized = upper(value);
        if (disabled) current.add(normalized);
        else current.delete(normalized);
        state[field] = [...current];
    }

    function compositionProposalList(rotation = state.rotation || {}) {
        const candidates = [
          rotation.weekCompositionProposals,
          rotation.dashboard?.weekCompositionProposals,
          rotation.dashboard?.activeTemporalGeneration?.weekCompositionProposals,
          rotation.activeTemporalGeneration?.weekCompositionProposals
        ];
        return candidates.find(Array.isArray) || [];
    }

    function activeWeekComposition(rotation = state.rotation || {}) {
        return rotation.activeWeekComposition ||
          rotation.dashboard?.activeWeekComposition ||
          rotation.active?.activeWeekComposition ||

    function compositionProposalByMode(proposals = [], mode = state.compositionSelectedMode) {
        return proposals.find((proposal) => upper(proposal?.mode) === upper(mode)) || proposals[0] || null;
    }

    function hydrateCompositionOverrides(proposal, active) {
        if (!proposal) return;
        const sameBase = active && (
          active.baseCompositionId === proposal.baseCompositionId ||
          active.baseCompositionId === proposal.compositionId ||
          (active.generationId === proposal.generationId && upper(active.mode) === upper(proposal.mode))
        );
        const sourceId = sameBase ? active.compositionId : proposal.compositionId;
        if (state.compositionOverridesSourceId === sourceId) return;
        const source = sameBase ? (active.overrides || {}) : {};
        state.compositionDisabledDays = compositionUnique(source.disabledDays || []);
        state.compositionDisabledHours = compositionUnique(source.disabledHours || []);
        state.compositionDisabledWeatherKeys = compositionUnique(source.disabledWeatherKeys || []);
        state.compositionDisabledBtcStates = compositionUnique(source.disabledBtcStates || []);
        state.compositionDisabledWeatherBtcKeys = compositionUnique(source.disabledWeatherBtcKeys || []);
        state.compositionDisabledDayHours = compositionUnique(source.disabledDayHours || []);
        state.compositionDisabledSlotWeatherKeys = compositionUnique(source.disabledSlotWeatherKeys || []);
        state.compositionDisabledDayHourWeatherBtcKeys = compositionUnique(
          source.disabledDayHourWeatherBtcKeys || source.disabledSlotWeatherKeys || []
        );
        state.compositionOverridesSourceId = sourceId;
    }

    function compositionDisabled(slot, overrides = compositionOverrides()) {
        if (!slot) return false;
        const weatherBtc = compositionWeatherBtcKey(slot.marketWeatherKey, slot.btcRouterState);
        return overrides.disabledDays.includes(slot.day) ||
          overrides.disabledHours.includes(slot.hourBucket) ||
          overrides.disabledWeatherKeys.includes(slot.marketWeatherKey) ||
          overrides.disabledBtcStates.includes(slot.btcRouterState) ||
          overrides.disabledWeatherBtcKeys.includes(weatherBtc) ||
          overrides.disabledDayHours.includes(`${slot.day}:${slot.hourBucket}`) ||
          overrides.disabledSlotWeatherKeys.includes(slot.key) ||
          overrides.disabledDayHourWeatherBtcKeys.includes(slot.key);
    }

    function compositionPreviewSlots(proposal, overrides = compositionOverrides()) {
        return Object.fromEntries(Object.entries(proposal?.slots || {})
          .filter(([, slot]) => slot?.enabled === true && !compositionDisabled(slot, overrides)));
    }

    function compositionSummaryFromSlots(slots = {}) {
        const rows = Object.values(slots || {});
        const completed = rows.reduce((sum, slot) => sum + Number(slot?.stats?.historicalCompleted || 0), 0);
        const wins = rows.reduce((sum, slot) => sum + Number(slot?.stats?.historicalWins || 0), 0);
        const totalR = rows.reduce((sum, slot) => sum + Number(slot?.stats?.historicalTotalNetR || 0), 0);
        const totalPnl = rows.reduce((sum, slot) => sum + Number(slot?.stats?.historicalTotalNetPnlPct || 0), 0);
        const expectedSignals = rows.reduce((sum, slot) => sum + Number(slot?.stats?.expectedSignalsPerWeek || 0), 0);
        const expectedR = rows.reduce((sum, slot) => sum + Number(slot?.stats?.expectedNetRPerWeek || 0), 0);
        const expectedPnl = rows.reduce((sum, slot) => sum + Number(slot?.stats?.expectedNetPnlPctPerWeek || 0), 0);
        const families = uniqueStrings(rows.flatMap((slot) => slot.selectedFamilyIds || []));
        const dayHours = new Set(rows.map((slot) => `${slot.day}:${slot.hourBucket}`));
        return {
          activeSlots: rows.length,
          activeDayHours: dayHours.size,
          familyCount: families.length,
          familyIds: families,
          historicalCompleted: completed,
          historicalWinrate: completed > 0 ? wins / completed : 0,
          historicalAvgNetR: completed > 0 ? totalR / completed : 0,
          historicalTotalNetR: totalR,
          historicalAvgNetPnlPct: completed > 0 ? totalPnl / completed : 0,
          historicalTotalNetPnlPct: totalPnl,
          expectedSignalsPerWeek: expectedSignals,
          expectedNetRPerWeek: expectedR,
          expectedNetPnlPctPerWeek: expectedPnl
        };
    }

    function normalizeCompositionRegime(value = "") {
        const raw = upper(value);
        if (raw.includes("SQUEEZE") || raw.includes("COMPRESSION")) return "SQUEEZE";
        if (raw.includes("CHOP") || raw.includes("RANGE") || raw.includes("SIDEWAYS")) return "CHOP";
        if (raw.includes("TREND") || raw.includes("MOMENTUM") || raw.includes("FLOW")) return "TREND";
        return "UNKNOWN";
    }

    function normalizeCompositionTrendSide(value = "") {
        const raw = upper(value);
        if (["LONG", "BULL", "BULLISH", "BUY", "UP"].some((token) => raw.includes(token))) return "LONG";
        if (["SHORT", "BEAR", "BEARISH", "SELL", "DOWN"].some((token) => raw.includes(token))) return "SHORT";
        if (["NEUTRAL", "MIXED", "FLAT", "SIDEWAYS"].some((token) => raw.includes(token))) return "NEUTRAL";
        return "UNKNOWN";
    }

    function normalizeCompositionBtcState(value = "") {
        const raw = upper(value);
        if (COMPOSITION_BTC_STATES.includes(raw)) return raw;
        if (raw.includes("STRONG_BULL") || raw.includes("VERY_BULL") || raw.includes("HARD_BULL")) return "STRONG_BULLISH";
        if (raw.includes("STRONG_BEAR") || raw.includes("VERY_BEAR") || raw.includes("HARD_BEAR")) return "STRONG_BEARISH";
        if (["BULLISH", "BULL", "LONG", "BUY", "UP"].some((token) => raw.includes(token))) return "BULLISH";
        if (["BEARISH", "BEAR", "SHORT", "SELL", "DOWN"].some((token) => raw.includes(token))) return "BEARISH";
        if (["NEUTRAL", "MIXED", "FLAT", "SIDEWAYS", "CHOP"].some((token) => raw.includes(token))) return "NEUTRAL";
        return "UNKNOWN";
    }

    function firstKnownCompositionValue(normalizer, values = []) {
        for (const value of values) {
          const normalized = normalizer(value);
          if (normalized !== "UNKNOWN") return normalized;
        }
        return "UNKNOWN";
    }

    function compositionObjectCandidates(market = {}) {
        const values = [
          market,
          market.source,
          market.raw,
          market.currentMarketWeather,
          market.marketWeather,
          market.weather,
          market.latest,
          market.snapshot,
          market.source?.currentMarketWeather,
          market.source?.marketWeather,
          market.source?.weather,
          market.raw?.currentMarketWeather,
          market.raw?.marketWeather,
          market.raw?.weather
        ];
        return values.filter((value, index) =>
          value && typeof value === "object" && !Array.isArray(value) && values.indexOf(value) === index
        );
    }

    function currentCompositionWeatherKey() {
        const market = state.market || {};
        const candidates = compositionObjectCandidates(market);

        const explicitKeys = [];
        for (const candidate of candidates) {
          explicitKeys.push(
            candidate?.currentMarketWeatherKey,
            candidate?.marketWeatherKey,
            candidate?.entryMarketWeatherKey,
            candidate?.marketWeatherProfileKey
          );
        }
        for (const value of explicitKeys) {
          const raw = upper(value);
          if (!raw.includes("|")) continue;
          const [regimePart, sidePart] = raw.split("|");
          const regime = normalizeCompositionRegime(regimePart);
          const side = normalizeCompositionTrendSide(sidePart);
          if (regime !== "UNKNOWN" && side !== "UNKNOWN") return `${regime}|${side}`;
        }

        const regimeValues = [];
        const sideValues = [];
        for (const candidate of candidates) {
          regimeValues.push(
            candidate?.currentRegime,
            candidate?.regime,
            candidate?.marketRegime,
            candidate?.breadthRegime,
            candidate?.volatilityRegime
          );
          sideValues.push(
            candidate?.currentTrendSide,
            candidate?.trendSide,
            candidate?.marketTrendSide,
            candidate?.marketSide,
            candidate?.side,
            candidate?.direction,
            candidate?.breadthSide
          );
        }
        const regime = firstKnownCompositionValue(normalizeCompositionRegime, regimeValues);
        const side = firstKnownCompositionValue(normalizeCompositionTrendSide, sideValues);
        return regime === "UNKNOWN" || side === "UNKNOWN" ? "UNKNOWN" : `${regime}|${side}`;
    }

    function currentCompositionBtcState() {
        const market = state.market || {};
        const candidates = compositionObjectCandidates(market);
        const values = [];
        for (const candidate of candidates) {
          values.push(
            candidate?.btcRouterState,
            candidate?.currentBtcRouterState,
            candidate?.btcState,
            candidate?.btcRelation,
            candidate?.currentBtcRelation,
            candidate?.btcDirection,
            candidate?.btcTrendSide,
            candidate?.btc?.btcRouterState,
            candidate?.btc?.btcState,
            candidate?.btc?.state,
            candidate?.btc?.direction,
            candidate?.btc?.trendSide,
            candidate?.btcContext?.btcRouterState,
            candidate?.btcContext?.btcState,
            candidate?.btcContext?.direction,
            candidate?.btcContext?.trendSide
          );
        }
        return firstKnownCompositionValue(normalizeCompositionBtcState, values);
    }
